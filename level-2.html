<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      第二关：关系与胆识 | 发家之路
    </title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="assets/js/save-system.js">
    </script>
    <script defer src="assets/js/level-game.js">
    </script>
  </head>
  <body class="level-game-page">
    <main>
      <section class="map-hero level-game level-two" id="level-game" data-level="2" tabindex="0" aria-label="第二关游戏地图">
        <div class="map-hud player-hud">
          <div class="pixel-avatar">
            你
          </div>
          <div>
            <strong>
              第二关 · 关系与胆识
            </strong>
            <dl>
              <div>
                <dt>
                  资金
                </dt>
                <dd data-stat="funds">
                </dd>
              </div>
              <div>
                <dt>
                  声望
                </dt>
                <dd data-stat="reputation">
                </dd>
              </div>
              <div>
                <dt>
                  时间
                </dt>
                <dd data-stat="day">
                </dd>
              </div>
            </dl>
          </div>
        </div>
        <div class="map-hud goal-hud">
          <p>
            当前目标
          </p>
          <strong data-goal>
          </strong>
          <div class="map-progress">
            <span data-progress>
            </span>
          </div>
          <small data-detail>
          </small>
        </div>
        <p class="map-intro">
          第二关 · 关系与胆识　方向键 / WASD 移动
        </p>
        <button class="map-location home" type="button" data-event="home">
          <b>
            办公室
          </b>
          <span>
            查看改造地图
          </span>
        </button>
        <button class="map-location cafe" type="button" data-event="cafe">
          <b>
            咖啡馆
          </b>
          <span>
            约见社区代表
          </span>
        </button>
        <button class="map-location company" type="button" data-event="company">
          <b>
            公司
          </b>
          <span>
            协商项目方案
          </span>
        </button>
        <div class="map-player">
          <span class="player-head">
          </span>
          <span class="player-body">
          </span>
        </div>
        <p class="map-prompt" aria-live="polite">
          方向键 / WASD 移动
        </p>
        <div class="map-caption">
          <span>
            LEVEL 02 · 1992
          </span>
          <strong>
            关系与胆识
          </strong>
        </div>
        <section class="game-dialog" aria-modal="true" hidden>
          <div class="paper-note">
            <button class="dialog-close" type="button" aria-label="关闭">
              ×
            </button>
            <p class="note-kicker">
            </p>
            <h2>
            </h2>
            <p class="event-copy">
            </p>
            <div class="dialog-choices">
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
