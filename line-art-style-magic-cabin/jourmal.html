<!DOCTYPE html>

<style>

    .hud-row {

    #checkpointLabel,

    }

    #hint {

    #hint.show {

    }

    #message {

            50%;

            18%;

            40;

            12px 20px;

        background:
            rgba(
                255,
                255,
                255,

            );

        border:
            1px solid
            rgba(

            );

<script>

'use strict';


const JOURNEY_RELIC_OBTAINED_KEY =
    'journeyRelicObtained';


const JOURNEY_RELIC_REWARD_KEY =
    'magicCabin.journeyRelicReward.v1';


/* ==========================================================
   01. CORE
   ========================================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0xf7f3e9
    );


scene.fog =
    new THREE.Fog(
        0xf7f3e9,
        28,
        76
    );


const camera =
    new THREE.PerspectiveCamera(

        50,

        innerWidth /
        innerHeight,

        0.1,

        160
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:
            true
    });


renderer.setPixelRatio(

    Math.min(

        devicePixelRatio,

        2
    )
);


renderer.setSize(

    innerWidth,

    innerHeight
);


document.body.appendChild(

    renderer.domElement
);


/* ==========================================================
   02. MATERIALS
   ========================================================== */

const MAT =
    new THREE.LineBasicMaterial({

        color:
            0x1b2420
    });


function fillMat(
    hex,
    opacity = 1
) {

    const material =
        new THREE.MeshBasicMaterial({

            color:
                hex,

            transparent:
                opacity < 1,

            opacity:
                opacity,

            side:
                opacity < 1
                    ? THREE.DoubleSide
                    : THREE.FrontSide,

            polygonOffset:
                true,

            polygonOffsetFactor:
                2,

            polygonOffsetUnits:
                2
        });


    return material;
}


const MAT_STONE =
    fillMat(
        0xe3dfd5
    );


const MAT_STONE_DARK =
    fillMat(
        0xbfc2bd
    );


const MAT_WOOD =
    fillMat(
        0xb79a72
    );


const MAT_WOOD_DARK =
    fillMat(
        0x8f7558
    );


const MAT_WATER =
    fillMat(
        0xaecbd2,
        0.55
    );


const MAT_MAGIC =
    fillMat(
        0xc7b6d6,
        0.58
    );


const MAT_MAGIC_WARN =
    fillMat(
        0xdfc8df,
        0.22
    );


const MAT_RELIC =
    fillMat(
        0xe7d4a4,
        0.92
    );


const MAT_CHECK =
    fillMat(
        0xc3d2c4
    );


/* ==========================================================
   03. ORIGINAL-STYLE HELPERS
   ========================================================== */

function edge(
    geo,
    mat = MAT_STONE,
    threshold = 1
) {

    const g =
        new THREE.Group();


    const mesh =
        new THREE.Mesh(
            geo,
            mat
        );


    g.add(
        mesh
    );


    const lines =
        new THREE.LineSegments(

            new THREE.EdgesGeometry(
                geo,
                threshold
            ),

            MAT
        );


    g.add(
        lines
    );


    return g;
}


function box(
    w,
    h,
    d,
    mat = MAT_STONE
) {

    return edge(

        new THREE.BoxGeometry(
            w,
            h,
            d
        ),

        mat
    );
}


function log(
    len,
    r = 0.08,
    mat = MAT_WOOD
) {

    return edge(

        new THREE.CylinderGeometry(
            r,
            r,
            len,
            8
        ),

        mat
    );
}


function put(
    o,
    x,
    y,
    z,
    rx = 0,
    ry = 0,
    rz = 0,
    parent = scene
) {

    o.position.set(
        x,
        y,
        z
    );


    o.rotation.set(
        rx,
        ry,
        rz
    );


    parent.add(
        o
    );


    return o;
}


function V(
    x,
    y,
    z
) {

    return new THREE.Vector3(
        x,
        y,
        z
    );
}


function line(
    pts,
    material = MAT
) {

    const geo =
        new THREE.BufferGeometry()
            .setFromPoints(

                pts.map(
                    p =>
                        V(
                            p[0],
                            p[1],
                            p[2]
                        )
                )
            );


    return new THREE.Line(
        geo,
        material
    );
}


/* ==========================================================
   04. INTERACTION
   ========================================================== */

const magicMeshes =
    [];


const interactables =
    [];


function regMagic(
    root,
    onClick
) {

    root.userData.onClick =
        onClick;


    root.traverse(
        m => {

            if (
                m.isMesh &&
                !m.userData.noHit
            ) {

                m.userData.magicRoot =
                    root;


                magicMeshes.push(
                    m
                );
            }
        }
    );


    return root;
}


/* ==========================================================
   05. PLAYER
   ========================================================== */

const player = {

    pos:
        new THREE.Vector3(
            0,
            0.18,
            10
        ),

    vy:
        0,

    yaw:
        Math.PI,

    moveSpeed:
        0,

    onGround:
        true,

    groundT:
        0,

    shield:
        100,

    oxygen:
        100
};


const PLAYER_R =
    0.26;


const keys =
    {};


let camYaw =
    Math.PI;


let camPitch =
    0.30;


let camDist =
    6.2;


let viewMode =
    'tp';


/* ==========================================================
   06. SLIME
   ========================================================== */

const slimeRoot =
    new THREE.Group();


scene.add(
    slimeRoot
);


const slimeBody =
    new THREE.Group();


slimeRoot.add(
    slimeBody
);


const slimeOuterMat =
    fillMat(
        0x86c5ae,
        0.40
    );


const slimeMidMat =
    fillMat(
        0xb6dacb,
        0.28
    );


const slimeCoreMat =
    fillMat(
        0x639c88,
        0.55
    );


const slimeGeo =
    new THREE.SphereGeometry(

        0.30,

        22,

        16
    );


const slimeOuter =
    new THREE.Mesh(

        slimeGeo,

        slimeOuterMat
    );


slimeBody.add(
    slimeOuter
);


const slimeEdges =
    new THREE.LineSegments(

        new THREE.EdgesGeometry(
            slimeGeo,
            18
        ),

        MAT
    );


slimeBody.add(
    slimeEdges
);


const slimeMid =
    new THREE.Mesh(

        slimeGeo.clone(),

        slimeMidMat
    );


slimeMid.scale.setScalar(
    0.88
);


slimeBody.add(
    slimeMid
);


const slimeCore =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.13,
            14,
            10
        ),

        slimeCoreMat
    );


slimeBody.add(
    slimeCore
);


const eyeMat =
    fillMat(
        0x25312b
    );


for (
    const x of [

        -0.085,

        0.085
    ]
) {

    const eye =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.025,
                8,
                6
            ),

            eyeMat
        );


    eye.position.set(

        x,

        0.055,

        0.275
    );


    eye.scale.set(

        0.7,

        1.1,

        0.45
    );


    slimeBody.add(
        eye
    );
}


/* ==========================================================
   07. COLLISION
   ========================================================== */

const solidBoxes =
    [];


const platformBoxes =
    [];


function addPlatform(
    x,
    top,
    z,
    w,
    d,
    thickness = 0.22,
    material = MAT_STONE
) {

    const g =
        put(

            box(
                w,
                thickness,
                d,
                material
            ),

            x,

            top -
            thickness / 2,

            z
        );


    platformBoxes.push({

        x1:
            x -
            w / 2,

        z1:
            z -
            d / 2,

        x2:
            x +
            w / 2,

        z2:
            z +
            d / 2,

        top:
            top
    });


    return g;
}


function addSolid(
    x,
    z,
    w,
    d
) {

    solidBoxes.push({

        x1:
            x -
            w / 2,

        z1:
            z -
            d / 2,

        x2:
            x +
            w / 2,

        z2:
            z +
            d / 2
    });
}


function groundAt(
    x,
    z,
    currentY
) {

    let best =
        -100;


    for (
        const b
        of platformBoxes
    ) {

        if (
            x >= b.x1 &&
            x <= b.x2 &&
            z >= b.z1 &&
            z <= b.z2
        ) {

            if (
                b.top <=
                currentY +
                0.55
            ) {

                best =
                    Math.max(
                        best,
                        b.top
                    );
            }
        }
    }


    return best;
}


function circleHitsBox(
    x,
    z,
    b
) {

    const qx =
        Math.max(

            b.x1,

            Math.min(
                x,
                b.x2
            )
        );


    const qz =
        Math.max(

            b.z1,

            Math.min(
                z,
                b.z2
            )
        );


    const dx =
        x -
        qx;


    const dz =
        z -
        qz;


    return (

        dx *
        dx

        +

        dz *
        dz

    ) <

        PLAYER_R *
        PLAYER_R;
}


function collideXZ(
    nx,
    nz,
    y
) {

    let x =
        nx;


    let z =
        nz;


    for (
        const b
        of solidBoxes
    ) {

        if (
            !circleHitsBox(
                x,
                z,
                b
            )
        ) {

            continue;
        }


        const left =
            Math.abs(

                x -

                (
                    b.x1 -
                    PLAYER_R
                )
            );


        const right =
            Math.abs(

                x -

                (
                    b.x2 +
                    PLAYER_R
                )
            );


        const front =
            Math.abs(

                z -

                (
                    b.z1 -
                    PLAYER_R
                )
            );


        const back =
            Math.abs(

                z -

                (
                    b.z2 +
                    PLAYER_R
                )
            );


        const m =
            Math.min(

                left,

                right,

                front,

                back
            );


        if (
            m ===
            left
        ) {

            x =
                b.x1 -
                PLAYER_R;

        } else if (
            m ===
            right
        ) {

            x =
                b.x2 +
                PLAYER_R;

        } else if (
            m ===
            front
        ) {

            z =
                b.z1 -
                PLAYER_R;

        } else {

            z =
                b.z2 +
                PLAYER_R;
        }
    }


    return [
        x,
        z
    ];
}


/* ==========================================================
   08. NATURAL CLIFF

   岩台 + 下方实体岩壁。
   ========================================================== */

function addCliffLedge(
    x,
    z,
    top,
    w,
    d,
    rotY = 0
) {

    const g =
        new THREE.Group();


    g.position.set(
        x,
        0,
        z
    );


    g.rotation.y =
        rotY;


    scene.add(
        g
    );


    /* ---------- 顶部 ---------- */

    const topPart =
        edge(

            new THREE.BoxGeometry(
                w,
                0.20,
                d
            ),

            MAT_STONE
        );


    topPart.position.y =
        top -
        0.10;


    g.add(
        topPart
    );


    /* ---------- 下方岩体 ---------- */

    const abyssY =
        -4.5;


    const supportTop =
        top -
        0.24;


    const supportH =
        supportTop -
        abyssY;


    const support =
        edge(

            new THREE.CylinderGeometry(

                Math.min(
                    w,
                    d
                ) *
                0.34,

                Math.min(
                    w,
                    d
                ) *
                0.52,

                supportH,

                7
            ),

            MAT_STONE_DARK
        );


    support.position.y =
        abyssY +
        supportH /
        2;


    g.add(
        support
    );


    /* ---------- 平台碰撞 ---------- */

    platformBoxes.push({

        x1:
            x -
            w /
            2,

        z1:
            z -
            d /
            2,

        x2:
            x +
            w /
            2,

        z2:
            z +
            d /
            2,

        top:
            top
    });

/* ==========================================================
   28. PLAYER UPDATE
   ========================================================== */

function updatePlayer(
    dt,
    time
) {

    let ix =
        0;


    let iz =
        0;


    if (
        keys['KeyW']
        ||
        keys['ArrowUp']
    ) {

        iz +=
            1;
    }


    if (
        keys['KeyS']
        ||
        keys['ArrowDown']
    ) {

        iz -=
            1;
    }


    if (
        keys['KeyA']
        ||
        keys['ArrowLeft']
    ) {

        ix -=
            1;
    }


    if (
        keys['KeyD']
        ||
        keys['ArrowRight']
    ) {

        ix +=
            1;
    }


    const m =
        Math.hypot(
            ix,
            iz
        );


    if (
        m >
        1
    ) {

        ix /=
            m;


        iz /=
            m;
    }


    const running =
        !!(
            keys['ShiftLeft']
            ||
            keys['ShiftRight']
        );


    const maxSpeed =
        running
            ? 3.2
            : 1.6;


    let tx =
        0;


    let tz =
        0;


    if (
        ix !==
        0

        ||

        iz !==
        0
    ) {

        const fx =
            Math.sin(
                camYaw
            );


        const fz =
            Math.cos(
                camYaw
            );


        const rx =
            -Math.cos(
                camYaw
            );


        const rz =
            Math.sin(
                camYaw
            );


        tx =

            (
                fx *
                iz

                +

                rx *
                ix
            )

            *

            maxSpeed;


        tz =

            (
                fz *
                iz

                +

                rz *
                ix
            )

            *

            maxSpeed;
    }


    player.moveSpeed +=

        (
            Math.hypot(
                tx,
                tz
            )

            -

            player.moveSpeed
        )

        *

        Math.min(
            1,
            dt *
            10
        );


    let nx =

        player.pos.x +
        tx *
        dt;


    let nz =

        player.pos.z +
        tz *
        dt;


    [
        nx,
        nz
    ] =
        collideXZ(

            nx,

            nz,

            player.pos.y
        );


    player.pos.x =
        nx;


    player.pos.z =
        nz;


    /* ======================================================
       重力 / 地面
       ====================================================== */

    const ground =
        groundAt(

            player.pos.x,

            player.pos.z,

            player.pos.y
        );


    if (
        player.pos.y <=
            ground +
            0.001

        &&

        player.vy <=
            0
    ) {

        player.pos.y =
            ground;


        player.vy =
            0;


        player.onGround =
            true;


        player.groundT =
            time;

    } else {

        player.vy -=

            22 *
            dt;


        player.pos.y +=

            player.vy *
            dt;


        const g2 =
            groundAt(

                player.pos.x,

                player.pos.z,

                player.pos.y
            );


        if (
            player.pos.y <=
                g2

            &&

            player.vy <=
                0
        ) {

            player.pos.y =
                g2;


            player.vy =
                0;


            player.onGround =
                true;


            player.groundT =
                time;

        } else {

            player.onGround =
                false;
        }
    }


    /* ======================================================
       朝向
       ====================================================== */

    if (
        player.moveSpeed >
        0.15
    ) {

        const targetYaw =
            Math.atan2(
                tx,
                tz
            );


        let d =

            (
                targetYaw

                -

                player.yaw

                +

                Math.PI *
                3
            )

            %

            (
                Math.PI *
                2
            )

            -

            Math.PI;


        player.yaw +=

            d *

            Math.min(

                1,

                dt *
                9
            );
    }


    /* ======================================================
       史莱姆动画
       ====================================================== */

    const moving =
        player.moveSpeed >
        0.12;


    const breathe =

        1

        +

        Math.sin(
            time *
            1.7
        )

        *

        0.025;


    const squash =

        moving

            ?

            0.94

            +

            Math.sin(
                time *
                7.0
            )

            *

            0.045

            :

            breathe;


    slimeBody.scale.set(

        1 /
        Math.sqrt(
            squash
        ),

        squash,

        1 /
        Math.sqrt(
            squash
        )
    );


    slimeRoot.position.set(

        player.pos.x,

        player.pos.y +
        0.30,

        player.pos.z
    );


    slimeRoot.rotation.y =
        player.yaw;


    /* ======================================================
       掉入深渊
       ====================================================== */

    if (
        player.pos.y <
        -4.2
    ) {

        respawn(
            '你跌下了悬崖'
        );
    }
}


/* ==========================================================
   29. CAMERA
   ========================================================== */

function updateCamera(
    dt
) {

    if (
        viewMode ===
        'fp'
    ) {

        const eye =
            new THREE.Vector3(

                player.pos.x,

                player.pos.y +
                0.55,

                player.pos.z
            );


        camera.position.copy(
            eye
        );


        const forward =
            new THREE.Vector3(

                Math.sin(
                    camYaw
                )

                *

                Math.cos(
                    camPitch
                ),

                Math.sin(
                    camPitch
                ),

                Math.cos(
                    camYaw
                )

                *

                Math.cos(
                    camPitch
                )
            );


        camera.lookAt(

            eye
                .clone()
                .add(
                    forward
                )
        );


        slimeRoot.visible =
            false;

    } else {

        slimeRoot.visible =
            true;


        const target =
            new THREE.Vector3(

                player.pos.x,

                player.pos.y +
                0.60,

                player.pos.z
            );


        const dist =
            camDist;


        const wanted =
            new THREE.Vector3(

                target.x

                -

                Math.sin(
                    camYaw
                )

                *

                Math.cos(
                    camPitch
                )

                *

                dist,

                target.y

                +

                Math.sin(
                    camPitch
                )

                *

                dist,

                target.z

                -

                Math.cos(
                    camYaw
                )

                *

                Math.cos(
                    camPitch
                )

                *

                dist
            );


        camera.position.lerp(

            wanted,

            Math.min(

                1,

                dt *
                7
            )
        );


        camera.lookAt(
            target
        );
    }
}


/* ==========================================================
   30. INTERACTION
   ========================================================== */

const hintEl =
    document.getElementById(
        'hint'
    );


const raycaster =
    new THREE.Raycaster();


const CENTER =
    new THREE.Vector2(
        0,
        0
    );


let nearestInteract =
    null;


let aimHit =
    null;


function ancestorVisible(
    o
) {

    let p =
        o;


    while (
        p
    ) {

        if (
            p.visible ===
            false
        ) {

            return false;
        }


        p =
            p.parent;
    }


    return true;
}


function aimRay() {

    raycaster.setFromCamera(

        CENTER,

        camera
    );


    const hits =
        raycaster
            .intersectObjects(

                magicMeshes,

                false
            )
            .filter(

                h =>
                    ancestorVisible(
                        h.object
                    )
            );


    if (
        !hits.length
    ) {

        return null;
    }


    const root =
        hits[0]
            .object
            .userData
            .magicRoot;


    if (
        !root
    ) {

        return null;
    }


    return {

        label:
            root.userData
                .aimLabel
            ||
            '交互',

        act:
            () =>
                root.userData
                    .onClick()
    };
}


/* ==========================================================
   31. INTERACTION HINT
   ========================================================== */

function updateInteractHint() {

    nearestInteract =
        null;


    aimHit =
        null;


    if (
        viewMode ===
        'fp'
    ) {

        aimHit =
            aimRay();


        if (
            aimHit
        ) {

            hintEl.innerHTML =

                '按 <b>E</b> '

                +

                aimHit.label;


            hintEl
                .classList
                .add(
                    'show'
                );


            return;
        }
    }


    let best =
        1e9;


    for (
        const it
        of interactables
    ) {

        const d =
            Math.hypot(

                player.pos.x -
                it.x,

                player.pos.z -
                it.z
            );


        if (
            d <
                it.r

            &&

            d <
                best
        ) {

            best =
                d;


            nearestInteract =
                it;
        }
    }


    if (
        nearestInteract
    ) {

        hintEl.innerHTML =

            '按 <b>E</b> '

            +

            nearestInteract.label;


        hintEl
            .classList
            .add(
                'show'
            );

    } else {

        hintEl
            .classList
            .remove(
                'show'
            );
    }
}


function doInteract() {

    if (
        viewMode ===
            'fp'

        &&

        aimHit
    ) {

        aimHit.act();


        return;
    }


    if (
        nearestInteract
    ) {

        nearestInteract.act();
    }
}


/* ==========================================================
   32. MAGIC UPDATE

   现在：
   - 两座塔
   - 预警 0.34 秒
   - 4 连发
   - 每发约 0.14 秒
   - 冷却只有 0.42 秒
   ========================================================== */

function updateMagic(
    dt,
    time
) {

    const inDanger =

        (
            player.pos.z <
                -12.2

            &&

            player.pos.z >
                -19.7
        );


    if (
        inDanger

        &&

        !respawning

        &&

        !relicCollected
    ) {

        magicState.t +=
            dt;


        /* ---------- IDLE ---------- */

        if (
            magicState.phase ===
                'idle'

            &&

            magicState.t >
                magicState.cooldown
        ) {

            magicState.phase =
                'warning';


            magicState.t =
                0;


            warningDisk.visible =
                true;


            warningDisk.position.set(

                player.pos.x,

                Math.max(

                    player.pos.y +
                    0.02,

                    0.30
                ),

                player.pos.z
            );
        }


        /* ---------- WARNING ---------- */

        else if (
            magicState.phase ===
                'warning'

            &&

            magicState.t >
                0.34
        ) {

            warningDisk.visible =
                false;


            magicState.phase =
                'burst';


            magicState.t =
                0;


            magicState.burstTimer =
                0;


            magicState.burstIndex =
                0;
        }


        /* ---------- BURST ---------- */

        else if (
            magicState.phase ===
            'burst'
        ) {

            magicState.burstTimer +=
                dt;


            if (
                magicState.burstTimer >
                    0.14

                &&

                magicState.burstIndex <
                    4
            ) {

                magicState.burstTimer =
                    0;


                const offsets = [

                    0,

                    -0.085,

                    0.085,

                    0
                ];


                const towers = [

                    towerA,

                    towerB,

                    towerA,

                    towerB
                ];


                spawnProjectile(

                    towers[
                        magicState.burstIndex
                    ],

                    offsets[
                        magicState.burstIndex
                    ],

                    magicState.burstIndex *
                    0.22
                );


                magicState.burstIndex++;
            }


            if (
                magicState.burstIndex >=
                4
            ) {

                magicState.phase =
                    'cooldown';


                magicState.t =
                    0;
            }
        }


        /* ---------- COOLDOWN ---------- */

        else if (
            magicState.phase ===
                'cooldown'

            &&

            magicState.t >
                0.42
        ) {

            magicState.phase =
                'idle';


            magicState.t =
                0;
        }

    } else {

        warningDisk.visible =
            false;


        magicState.phase =
            'idle';


        magicState.t =
            0;


        magicState.burstIndex =
            0;


        magicState.burstTimer =
            0;
    }


    /* ======================================================
       更新所有魔法弹
       ====================================================== */

    for (
        let i =
            projectiles.length -
            1;

        i >=
        0;

        i--
    ) {

        const p =
            projectiles[i];


        p.life -=
            dt;


        p.g.position
            .addScaledVector(

                p.dir,

                p.speed *
                dt
            );


        p.g.rotation.x +=

            dt *
            5;


        p.g.rotation.y +=

            dt *
            8;


        const dx =

            p.g.position.x -
            player.pos.x;


        const dy =

            p.g.position.y

            -

            (
                player.pos.y +
                0.30
            );


        const dz =

            p.g.position.z -
            player.pos.z;


        const d =
            Math.hypot(

                dx,

                dy,

                dz
            );


        if (
            d <
            0.43
        ) {

            damagePlayer(

                34,

                p.dir
            );


            scene.remove(
                p.g
            );


            projectiles.splice(
                i,
                1
            );


            message(
                '魔法击中了你'
            );


            continue;
        }


        if (
            p.life <=
            0
        ) {

            scene.remove(
                p.g
            );


            projectiles.splice(
                i,
                1
            );
        }
    }
}


/* ==========================================================
   33. WATER UPDATE

   深水耗氧明显加快。
   ========================================================== */

function updateWater(
    dt
) {

    if (
        insideWater()
    ) {

        player.oxygen -=

            dt *
            0.31;


        player.oxygen =
            Math.max(

                0,

                player.oxygen
            );


        /* 水下阻力 */

        player.moveSpeed *=
            0.96;


        if (
            player.oxygen <=
            0
        ) {

            respawn(
                '你在深水中失去了力气'
            );
        }

    } else {

        player.oxygen +=

            dt *
            40;


        player.oxygen =
            Math.min(

                100,

                player.oxygen
            );
    }
}


/* ==========================================================
   34. RELIC ANIMATION
   ========================================================== */

function updateRelic(
    dt,
    time
) {

    if (
        relicCollected
    ) {

        relicG.position.y +=

            dt *
            0.38;


        relicG.rotation.y +=

            dt *
            1.8;


        relicG.scale.multiplyScalar(

            Math.max(

                0.985,

                1 -
                dt *
                0.38
            )
        );


        if (
            relicG.scale.x <
            0.04
        ) {

            relicG.visible =
                false;
        }


        return;
    }


    relicG.position.y =

        2.15

        +

        Math.sin(
            time *
            1.6
        )

        *

        0.10;


    relicRingA.rotation.y +=

        dt *
        0.7;


    relicRingB.rotation.z +=

        dt *
        0.9;
}


/* ==========================================================
   35. UI
   ========================================================== */

const shieldFill =
    document.getElementById(
        'shieldFill'
    );


const oxygenFill =
    document.getElementById(
        'oxygenFill'
    );


const checkpointLabel =
    document.getElementById(
        'checkpointLabel'
    );


const relicLabel =
    document.getElementById(
        'relicLabel'
    );


const messageEl =
    document.getElementById(
        'message'
    );


const crosshair =
    document.getElementById(
        'crosshair'
    );


const deathMask =
    document.getElementById(
        'deathMask'
    );


const finishPanel =
    document.getElementById(
        'finishPanel'
    );


let messageUntil =
    0;


function message(
    text
) {

    messageEl.textContent =
        text;


    messageEl
        .classList
        .add(
            'show'
        );


    messageUntil =
        performance.now()
        +
        1800;
}


function updateUI() {

    shieldFill.style.width =

        player.shield +
        '%';


    oxygenFill.style.width =

        player.oxygen +
        '%';


    if (
        performance.now() >
        messageUntil
    ) {

        messageEl
            .classList
            .remove(
                'show'
            );
    }
}


/* ==========================================================
   36. INPUT
   ========================================================== */

addEventListener(

    'keydown',

    e => {

        keys[
            e.code
        ] =
            true;


        if (
            e.code ===
            'Space'
        ) {

            e.preventDefault();


            tryJump();
        }


        if (
            e.code ===
            'KeyE'
        ) {

            doInteract();
        }


        if (
            e.code ===
            'KeyV'
        ) {

            viewMode =

                viewMode ===
                'fp'

                    ?

                    'tp'

                    :

                    'fp';


            crosshair.style.display =

                viewMode ===
                'fp'

                    ?

                    'block'

                    :

                    'none';
        }
    }
);


addEventListener(

    'keyup',

    e => {

        keys[
            e.code
        ] =
            false;


        if (
            e.code ===
                'Space'

            &&

            player.vy >
                2.6
        ) {

            player.vy =
                2.6;
        }
    }
);


/* ==========================================================
   37. CAMERA DRAG
   ========================================================== */

let dragging =
    false;


let lastMX =
    0;


let lastMY =
    0;


renderer.domElement
    .addEventListener(

        'pointerdown',

        e => {

            dragging =
                true;


            lastMX =
                e.clientX;


            lastMY =
                e.clientY;
        }
    );


addEventListener(

    'pointerup',

    () => {

        dragging =
            false;
    }
);


addEventListener(

    'pointermove',

    e => {

        if (
            !dragging
        ) {

            return;
        }


        const dx =

            e.clientX -
            lastMX;


        const dy =

            e.clientY -
            lastMY;


        lastMX =
            e.clientX;


        lastMY =
            e.clientY;


        camYaw -=

            dx *
            0.006;


        camPitch -=

            dy *
            0.004;


        if (
            viewMode ===
            'fp'
        ) {

            camPitch =
                Math.max(

                    -1.15,

                    Math.min(

                        1.15,

                        camPitch
                    )
                );

        } else {

            camPitch =
                Math.max(

                    -0.10,

                    Math.min(

                        1.05,

                        camPitch
                    )
                );
        }
    }
);


renderer.domElement
    .addEventListener(

        'wheel',

        e => {

            camDist =
                Math.max(

                    2.8,

                    Math.min(

                        10,

                        camDist +
                        e.deltaY *
                        0.004
                    )
                );
        },

        {
            passive:
                true
        }
    );


/* ==========================================================
   38. RESTART
   ========================================================== */

document
    .getElementById(
        'restartBtn'
    )
    .addEventListener(

        'click',

        () => {
            location.reload();
        }
    );


/* ==========================================================
   39. RESIZE
   ========================================================== */

addEventListener(

    'resize',

    () => {

        camera.aspect =

            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            innerWidth,

            innerHeight
        );
    }
);


/* ==========================================================
   40. CAMERA INITIAL
   ========================================================== */

camera.position.set(

    5.5,

    4.2,

    15
);


camera.lookAt(

    0,

    0.6,

    10
);


/* ==========================================================
   41. MAIN LOOP
   ========================================================== */

let lastT =
    0;


function animate(
    ms
) {

    requestAnimationFrame(
        animate
    );


    const time =

        ms *
        0.001;


    const dt =
        Math.min(

            time -
            lastT,

            0.05
        );


    lastT =
        time;


    if (
        !respawning

        &&

        !finishPanel
            .classList
            .contains(
                'show'
            )
    ) {

        updatePlayer(
            dt,
            time
        );


        updateWater(
            dt
        );


        updateMagic(
            dt,
            time
        );


        updateInteractHint();
    }


    updateRelic(
        dt,
        time
    );


    updateCamera(
        dt
    );


    updateUI();


    renderer.render(

        scene,

        camera
    );
}


requestAnimationFrame(
    animate
);

</script>
