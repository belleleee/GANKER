<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>第一份农场简历</title>
<link rel="stylesheet" href="./level_one.css">
<style>
  :root{
    --gold: #c9a76a;
    --ink: #f2efe8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; }
  body{
    font-family: "Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    color: var(--ink);
    user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }

  .image-stack{
    position: fixed;
    top: 8%;
    left: 0;
    width: 100%;
    height: 66.5%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
    box-shadow: inset 0 0 90px rgba(0,0,0,.55);
    border-top: 1px solid rgba(255,255,255,.05);
    border-bottom: 1px solid rgba(255,255,255,.05);
    transition: opacity .55s ease;
  }
  .fade-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 32%;
    opacity: 0; /* 初始状态透明 */
    filter: grayscale(1) contrast(1.06) brightness(.92);
    animation:
      sequentialFade 2.2s ease-in forwards,
      kenburns 30s ease-out forwards;
  }
  @keyframes sequentialFade{
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes kenburns{
    from{ transform: scale(1.02); }
    to{ transform: scale(1.09); }
  }

  /* 胶片颗粒 */
  .grain{
    position:absolute; inset:0;
    opacity:.07;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.9'/></svg>");
    animation: grainShift .7s steps(3) infinite;
  }
  @keyframes grainShift{
    0%{ transform:translate(0,0); }
    33%{ transform:translate(-3%,2%); }
    66%{ transform:translate(2%,-2%); }
    100%{ transform:translate(0,0); }
  }

  .vignette{
    position:absolute; inset:0;
    background: radial-gradient(ellipse 120% 90% at 50% 40%, transparent 52%, rgba(0,0,0,.6) 100%);
  }
  .bottom-fade{
    position:absolute; inset:0;
    background: linear-gradient(to bottom, rgba(0,0,0,.28) 0%, transparent 22%, transparent 60%, rgba(0,0,0,.8) 100%);
  }

  body[data-scene="4"] .fade-img{
    object-position: center 34%;
    filter: grayscale(1) contrast(1.02) brightness(1.05);
  }
  body[data-scene="4"] .vignette{
    background: radial-gradient(ellipse 120% 90% at 50% 40%, transparent 58%, rgba(0,0,0,.42) 100%);
  }
  body[data-scene="4"] .bottom-fade{
    background: linear-gradient(to bottom, rgba(0,0,0,.24) 0%, transparent 22%, transparent 60%, rgba(0,0,0,.78) 100%);
  }

  body[data-scene="5"] .fade-img{
    object-position: center 40%;
    filter: grayscale(1) contrast(1.05) brightness(.95);
  }
  body[data-scene="5"] .vignette{
    background: radial-gradient(ellipse 120% 90% at 50% 42%, transparent 46%, rgba(0,0,0,.62) 100%);
  }

  /* ===== 右上角场景角标 ===== */
  .scene-tag{
    position: fixed;
    top: 2.6%;
    right: 3.2%;
    z-index: 20;
    font-size: clamp(.72rem, 1vw, .95rem);
    letter-spacing: .42em;
    text-indent: .42em;
    color: rgba(242,239,232,.62);
    pointer-events:none;
    animation: tagIn 3s ease .4s both;
  }
  @keyframes tagIn{
    from{ opacity:0; letter-spacing:.6em; }
    to{ opacity:1; letter-spacing:.42em; }
  }

  /* ===== 对话框 ===== */
  .dialog-box{
    position: fixed;
    left: 3%;
    right: 3%;
    bottom: 2.8%;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(8,8,10,.82), rgba(4,4,5,.94));
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    padding: 1.6rem 2.4rem 1.7rem;
    min-height: 21vh;
    display: flex;
    align-items: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    animation: dialogIn 1s ease .5s both;
  }
  @keyframes dialogIn{
    from{ opacity:0; transform: translateY(26px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .dialog-bar{
    flex: 0 0 3px;
    align-self: stretch;
    margin-right: 1.6rem;
    background: linear-gradient(to bottom, transparent, var(--gold) 18%, var(--gold) 82%, transparent);
  }
  .dialog-main{ flex:1; min-width:0; }

  .speaker{
    display:inline-block;
    font-size: clamp(.7rem,.95vw,.88rem);
    letter-spacing:.34em;
    text-indent:.34em;
    color: var(--gold);
    border:1px solid rgba(201,167,106,.45);
    padding:.28em 1em .28em .66em;
    border-radius: 2px;
    margin-bottom:.85rem;
    background: rgba(201,167,106,.06);
  }
  /* 角色配色 */
  .speaker.mother{
    color: #d68d6f;
    border-color: rgba(214,141,111,.5);
    background: rgba(214,141,111,.08);
  }
  .speaker.father{
    color: #8fa9bd;
    border-color: rgba(143,169,189,.5);
    background: rgba(143,169,189,.08);
  }
  .speaker.grandfather{
    color: #6f8f72;
    border-color: rgba(111,143,114,.55);
    background: rgba(111,143,114,.08);
  }
  .speaker.guide,
  .speaker.captain{
    color: #b8a36f;
    border-color: rgba(184,163,111,.52);
    background: rgba(184,163,111,.08);
  }
  .speaker.ahai{
    color: #9dc6b8;
    border-color: rgba(157,198,184,.52);
    background: rgba(157,198,184,.08);
  }
  .speaker.you{
    color: #d8c58b;
    border-color: rgba(216,197,139,.56);
    background: rgba(216,197,139,.09);
  }
  .line{
    font-size: clamp(1.02rem, 1.5vw, 1.32rem);
    line-height: 2.05;
    letter-spacing: .06em;
    min-height: 4.1em;
    text-align: justify;
    text-justify: inter-ideograph;
  }
  .line.action{
    color: rgba(242,239,232,.7);
    font-style: italic;
    letter-spacing: .03em;
  }
  .line .caret{
    display:inline-block;
    width:.55em; height:1.05em;
    margin-left:.12em;
    vertical-align:-.18em;
    background: var(--gold);
    animation: blink .75s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .dialog-hint{
    position:absolute;
    right: 1.6rem;
    bottom: .9rem;
    font-size: .78rem;
    letter-spacing:.2em;
    color: rgba(242,239,232,.65);
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  .dialog-hint.done{
    animation:none;
    color: rgba(201,167,106,.85);
  }
  @keyframes hintPulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:1; }
  }
</style>
</head>
<body data-scene="1">

  <div class="image-stack" id="imageStack">
    <img class="fade-img" id="bg" src="./image1.png" alt="老宅" />
    <div class="vignette"></div>
    <div class="bottom-fade"></div>
    <div class="grain"></div>
  </div>

  <div class="scene-tag" id="sceneTag">宿迁 · 一九四五年秋</div>

  <div class="dialog-box">
    <div class="dialog-bar"></div>
    <div class="dialog-main">
      <div class="speaker" id="speaker">旁　白</div>
      <p class="line" id="line"></p>
    </div>
    <div class="dialog-hint" id="hint">▼ 点击继续</div>
  </div>

<script>
  const SCENES = [
    {
      title: '1945·秋 · 老宅',
      tag: '宿迁 · 一九四五年秋',
      img: './image1.png',
      alt: '老宅',
      lines: [
        { who:'narration', text:'1945年，秋天。' },
        { who:'narration', text:'江苏宿迁，一条叫不出名字的老巷深处。祖父的宅子还在，但里里外外已经搬空了大半。' },
        { who:'narration', text:'几个月前，日本人投降了。街上有人放鞭炮，有人哭，有人连夜换了门前的旗子。但对于这个家来说，真正的动荡，才刚要开始。' }
      ]
    },
    {
      title: '1945·秋 · 内室',
      tag: '内室 · 一九四五年秋',
      img: './image2.png',
      alt: '内室',
      lines: [
        { who:'mother',  text:'……你看清楚了？真的……一封都没有了？' },
        { who:'father',  text:'上个月还有两份，这个月……全停了。说是“新政府要重新审核旧人员的任用”，我父亲的老关系……现在都成了忌讳。' },
        { who:'mother',  text:'那你打算怎么办？' },
        { who:'father',  text:'……我写了几封信，托人问问杭州那边，有没有相熟的商号能收留。实在不行，卖字画也能撑一阵。' },
        { who:'mother',  text:'这孩子来得不是时候。' },
        { who:'father',  text:'……不。他来得正是时候。这个家，得有人往下走。' },
        { who:'narration', text:'你当然不记得这一天。但很多年后，母亲偶尔提起，说那天的风特别大，院子里的老槐树落了一地的叶子，像是整个时代都在掉叶子。' }
      ]
    },
    {
      title: '1945·秋 · 书房',
      tag: '书房 · 一九四五年秋',
      img: './image3.png',
      alt: '书房',
      lines: [
        { who:'narration', text:'祖父曾经是张作霖手下的一名财政官员。在北洋时代，那是个能让人敬畏的职位。' },
        { who:'narration', text:'但北洋散了，东北易帜，抗战，然后是国共内战……每一次政权更迭，都像一把刀，把“家世”两个字削去一层。' },
        { who:'grandfather', text:'（一边封箱，一边对身边的父亲说，语气急促但不失沉稳）' },
        { who:'grandfather', text:'这些卷宗，今晚全部烧掉。一页不留。' },
        { who:'father', text:'爹……真的没有别的办法了？您在沈阳这么多年，总还有……' },
        { who:'grandfather', text:'糊涂！现在不是讲“还有”的时候。新政府看的是成分，不是功劳。这些东西留下来，就是给子孙后代的催命符。' },
        { who:'grandfather', text:'我这一辈子的字纸，就烧在这院子里了。你记住——往后这个家，不靠祖宗，靠手脚。' },
        { who:'narration', text:'那些卷宗和信函，当晚在后院化成了灰烬。祖父从此闭门不出，不再提任何旧事。而“成分”这两个字，像一枚暗钉，从此钉进了这个家庭的户口簿里。' }
      ]
    },
    {
      title: '杭州 · 阁楼',
      tag: '杭州 · 一九五〇年代初',
      img: './image4.png',
      alt: '杭州老街阁楼',
      lines: [
        { who:'narration', text:'祖父去世后，父亲变卖了宿迁最后的家产，举家迁往杭州。寄居在远房亲戚腾出的一间阁楼里。' },
        { who:'narration', text:'曾经识文断字的父亲，如今只能在一些小商号里抄账本、写对联，赚一点零散的润笔。有时一个月都接不到一单活。' },
        { who:'narration', text:'母亲阿娟——她原本是殷实人家的女儿，读过几年私塾——经人介绍，在附近的一所小学谋到了一个代课教员的职位。每月工资不到三十块，却要养活五口人。' }
      ]
    },
    {
      title: '阁楼 · 夜',
      tag: '阁楼 · 一九五〇年代初',
      img: './image5.png',
      alt: '阁楼油灯夜',
      lines: [
        { who:'mother', text:'今天房东又来催租了。我说月底一定凑齐——拿什么凑，我心里也没底。' },
        { who:'father', text:'……我明天去码头问问，那些卸货的工头要不要人手。' },
        { who:'father', text:'世道变了，人就得跟着变。写字换不来米，扛麻袋至少能换一顿。' },
        { who:'narration', text:'你没完全听懂他们在说什么。但你记住了母亲那时的表情——她没叹气，也没掉眼泪，只是把作业本翻了一页，继续批改。' },
        { who:'narration', text:'很多年后你才明白，那是一种叫作“撑”的神情。' }
      ]
    },
    {
      title: '巷口 · 小摊',
      tag: '杭州巷口 · 少年时期',
      img: './image4.png',
      alt: '杭州巷口',
      lines: [
        { who:'narration', text:'七八岁的时候，别家的孩子还在巷子里拍洋片、滚铁环，你已经守着铁锅，把生米炒成喷香的炒米。' },
        { who:'narration', text:'一毛钱一包，用旧报纸卷成漏斗状，装满，递出去。冬天风从巷口灌进来，你手背上的冻疮裂开，铁铲却不能停。' },
        { who:'narration', text:'你没有问过“为什么”。穷在那个年代不是什么秘密，是常态。能帮家里多挣一分钱，就是一分钱。' }
      ]
    },
    {
      title: '师范学校门口',
      tag: '杭州 · 一九六〇年代',
      img: './image3.png',
      alt: '通知书',
      lines: [
        { who:'narration', text:'初中毕业那年，你偷偷报考了一所不收学费的师范学校。通知书寄到的时候，你站在邮筒前看了三遍，才敢拆开。' },
        { who:'narration', text:'录取了。你以为终于有一条路，可以不靠家里就能走下去。可高兴只持续了三天。' },
        { who:'narration', text:'成分核查的人来了。那几个字被写进表格，也像一扇门，在你面前合上。你没有争辩，只记住了：往后，别再指望任何一张纸改变命。' }
      ]
    },
    {
      title: '马目农场',
      tag: '舟山 · 马目农场',
      img: './image1.png',
      alt: '农场大门',
      lines: [
        { who:'guide', text:'到了啊。这就是马目农场。从前关犯人的地方。你们这批人，往后就住这儿了。' },
        { who:'narration', text:'没有电，没有自来水，宿舍屋顶铺着油毡，漏雨是常事。可这里至少有一件事是公平的：干了活，就有工分。' },
        { who:'ahai', text:'哥们儿，咱这是来当知青，还是来腌咸菜啊？' },
        { who:'you', text:'来都来了，说这些没用。' }
      ]
    },
    {
      title: '深夜 · 宿舍',
      tag: '马目农场 · 深夜',
      img: './image5.png',
      alt: '农场宿舍',
      lines: [
        { who:'ahai', text:'我撑不住了。我想跟家里说，我要回去。哪怕回去挨骂，也比在这儿看不到头强。' },
        { who:'you', text:'再撑一撑。这地方要熬出个人样，得先熬过这一关。' },
        { who:'narration', text:'那晚之后，阿海再没提过“回去”两个字。多年以后，当他愿意跟着你蹬三轮时，你偶尔还会想起这个晚上。' }
      ]
    },
    {
      title: '绍兴茶场',
      tag: '绍兴 · 茶场',
      img: './image4.png',
      alt: '绍兴茶场',
      lines: [
        { who:'narration', text:'后来，你被转到绍兴茶场。春天采茶，夏天锄草，秋天割稻，冬天垦荒。一晃，就是好几年。' },
        { who:'captain', text:'没人看着你的时候，最能看出一个人的成色。' },
        { who:'narration', text:'你把这句话记了很久。它不漂亮，却管用。能把一件事做到底的人，差不了。' }
      ]
    },
    {
      title: '回城 · 申请',
      tag: '杭州 · 一九七八年以后',
      img: './image2.png',
      alt: '回城申请',
      lines: [
        { who:'narration', text:'1978年，你回到杭州，接过母亲的班，进了校办工厂。日子重新开始，可你知道，自己不能只等一份死工资。' },
        { who:'you', text:'我想来经营这片农场。不是为了轻松，是想把能做的事做起来，替家里多分担一点。' },
        { who:'narration', text:'这就是第一份简历。它没有漂亮履历，只有一双做过很多活的手，和一颗愿意把日子撑起来的心。' }
      ]
    }
  ];
  const WHO_NAME = {
    narration:'旁　白',
    mother:'母　亲',
    father:'父　亲',
    grandfather:'祖　父',
    guide:'农场接引员',
    ahai:'阿　海',
    you:'申请人',
    captain:'队长老陈'
  };

  const lineEl = document.getElementById('line');
  const hintEl = document.getElementById('hint');
  const speakerEl = document.getElementById('speaker');
  const bgEl = document.getElementById('bg');
  const sceneTagEl = document.getElementById('sceneTag');
  const stackEl = document.getElementById('imageStack');

  let scene = 0;                 /* 当前幕索引 */
  let idx = -1, typing = false, finished = false, timer = null;

  function getLines(){ return SCENES[scene].lines; }

  function setSpeaker(who){
    speakerEl.textContent = WHO_NAME[who] || WHO_NAME.narration;
    speakerEl.className = 'speaker' + (who === 'narration' ? '' : ' ' + who);
  }

  /* 一幕结束时的提示文案 */
  function setEndHint(){
    if(scene === SCENES.length - 1){
      hintEl.textContent = '▼ 提交简历';
      hintEl.classList.add('done');
    } else {
      hintEl.textContent = '▼ 进入下一幕';
      hintEl.classList.remove('done');
    }
  }

  function completeResume(){
    try {
      if(window.parent && window.parent !== window){
        window.parent.postMessage({ type:'farm-resume-complete' }, '*');
      }
      localStorage.setItem('magicCabin.farmResumeSeen.v1', '1');
    } catch(err) {}
  }

  function typeLine(i){
    const full = getLines()[i].text;
    let pos = 0;
    typing = true;
    setSpeaker(getLines()[i].who);
    lineEl.classList.toggle('action', full.charAt(0) === '（');
    hintEl.style.visibility = 'hidden';
    lineEl.textContent = '';
    clearInterval(timer);
    timer = setInterval(()=>{
      pos++;
      lineEl.textContent = full.slice(0, pos);
      if(pos < full.length){
        const caret = document.createElement('span');
        caret.className = 'caret';
        lineEl.appendChild(caret);
      }
      if(pos >= full.length){
        clearInterval(timer);
        typing = false;
        if(i === getLines().length - 1){
          finished = true;
          setEndHint();
        }
        hintEl.style.visibility = 'visible';
      }
    }, 55);
  }

  /* 切换至下一幕 */
  function switchScene(){
    scene++;
    const S = SCENES[scene];
    stackEl.style.opacity = '0';
    setTimeout(()=>{
      bgEl.src = S.img;
      bgEl.alt = S.alt;
      sceneTagEl.textContent = S.tag;
      document.title = S.title;
      document.body.dataset.scene = String(scene + 1);
      idx = -1; typing = false; finished = false;
      hintEl.classList.remove('done');
      hintEl.textContent = '▼ 点击继续';
      hintEl.style.visibility = 'visible';
      stackEl.style.opacity = '1';
      setTimeout(advance, 350);
    }, 600);
  }

  function advance(){
    if(finished){
      if(scene < SCENES.length - 1) switchScene();
      else completeResume();
      return;
    }
    if(typing){
      /* 打字时点击：立即显示完整一行 */
      clearInterval(timer);
      lineEl.textContent = getLines()[idx].text;
      typing = false;
      if(idx === getLines().length - 1){
        finished = true;
        setEndHint();
      }
      hintEl.style.visibility = 'visible';
      return;
    }
    if(idx < getLines().length - 1){
      idx++;
      typeLine(idx);
    }
  }

  /* 等背景淡入后再出现第一行 */
  setTimeout(advance, 1900);

  document.addEventListener('click', (e)=>{
    advance();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowRight'){
      e.preventDefault();
      advance();
    }
  });
</script>
</body>
</html>
