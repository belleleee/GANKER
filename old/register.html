<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      注册 | 发家之路
    </title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="assets/js/save-system.js">
    </script>
    <script defer src="assets/js/main.js">
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        发家之路
        <small>
          FORTUNE ROAD
        </small>
      </a>
      <nav>
        <a href="index.html">
          返回首页
        </a>
        <a href="team.html">
          制作小组
        </a>
        <a class="nav-button" href="login.html">
          已有账号
        </a>
      </nav>
    </header>
    <main class="form-page">
      <form class="form-box" data-register-form>
        <p class="eyebrow">
          NEW PLAYER
        </p>
        <h1>
          建立档案
        </h1>
        <p>
          给这段冒险留下一个名字。从此，每次选择都有迹可循。
        </p>
        <label for="name">
          玩家昵称
        </label>
        <input id="name" type="text" placeholder="例如：远见者" required>
        <label for="email">
          邮箱
        </label>
        <input id="email" type="email" placeholder="name@example.com" required>
        <label for="new-password">
          设置密码
        </label>
        <input id="new-password" type="password" placeholder="至少 6 位" minlength="6" required>
        <button class="button" type="submit">
          创建我的档案
        </button>
        <p class="form-message" aria-live="polite">
        </p>
        <p>
          已经有档案？
          <a href="login.html">
            返回登录
          </a>
        </p>
      </form>
    </main>
  </body>
</html>
