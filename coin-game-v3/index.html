<script>
'use strict';

/* ==========================================================
   1. THREE 基础
   ========================================================== */

const scene =

/* ==========================================================
   2. 材质
   ========================================================== */

const LINE_MAT =
    new THREE.LineBasicMaterial({
        color:
            0x292923
    });


function material(
    color,
    opacity = 1
) {

    return new THREE.MeshBasicMaterial({
        color:
            color,

        transparent:
            opacity < 1,

        opacity:
            opacity,

        side:
            THREE.DoubleSide
    });
}


const M = {

    wall:
        material(
            0xeee6d7
        ),

    wood:
        material(
            0xb89568
        ),

    darkWood:
        material(
            0x876847
        ),

    floor:
        material(
            0xd7c4a0
        ),

    leaf:
        material(
            0xa8b889
        ),

    coin:
        material(
            0xe8bd51
        ),

    coinDark:
        material(
            0xb88828
        ),

    glass:
        material(
            0xbfdbe4,
            0.32
        )
};


/* ==========================================================
   3. 基础绘制函数
   ========================================================== */

function clamp(
    v,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            v
        )
    );
}


function edge(
    geometry,
    mat,
    threshold = 1
) {

    const group =
        new THREE.Group();


    const mesh =
        new THREE.Mesh(
            geometry,
            mat
        );


    const lines =
        new THREE.LineSegments(

            new THREE.EdgesGeometry(
                geometry,
                threshold
            ),

            LINE_MAT
        );


    group.add(
        mesh
    );

    group.add(
        lines
    );


    return group;
}


function box(
    w,
    h,
    d,
    mat = M.wood
) {

    return edge(

        new THREE.BoxGeometry(
            w,
            h,
            d
        ),

        mat
    );
}


function put(
    obj,
    x,
    y,
    z,
    rx = 0,
    ry = 0,
    rz = 0,
    parent = scene
) {

    obj.position.set(
        x,
        y,
        z
    );

    obj.rotation.set(
        rx,
        ry,
        rz
    );

    parent.add(
        obj
    );


    return obj;
}

/* ==========================================================
   7. 史莱姆
   ========================================================== */

function createSlime(
    bodyColor = 0x55d7a0,
    scale = 1
) {

    const root =
        new THREE.Group();


    const body =
        new THREE.Group();

    root.add(
        body
    );


    body.position.y =
        0.32 *
        scale;


    const baseColor =
        new THREE.Color(
            bodyColor
        );


    const midColor =
        baseColor
            .clone()
            .lerp(
                new THREE.Color(
                    0xffffff
                ),
                0.38
            );


    const coreColor =
        baseColor
            .clone()
            .multiplyScalar(
                0.76
            );


    const membraneMat =
        new THREE.MeshBasicMaterial({

            color:
                baseColor,

            transparent:
                true,

            opacity:
                0.42,

            side:
                THREE.DoubleSide,

            depthWrite:
                false
        });


    const midMat =
        new THREE.MeshBasicMaterial({

            color:
                midColor,

            transparent:
                true,

            opacity:
                0.30,

            side:
                THREE.DoubleSide,

            depthWrite:
                false
        });


    const coreMat =
        new THREE.MeshBasicMaterial({

            color:
                coreColor,

            transparent:
                true,

            opacity:
                0.52
        });


    const radius =
        0.32 *
        scale;


    const geometry =
        new THREE.SphereGeometry(
            radius,
            26,
            18
        );


    const membrane =
        new THREE.Mesh(
            geometry,
            membraneMat
        );


    body.add(
        membrane
    );


    body.add(

        new THREE.LineSegments(

            new THREE.EdgesGeometry(
                geometry,
                18
            ),

            LINE_MAT
        )
    );


    const midLayer =
        new THREE.Mesh(
            geometry.clone(),
            midMat
        );


    midLayer.scale.setScalar(
        0.90
    );


    body.add(
        midLayer
    );


    const core =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.145 * scale,
                18,
                14
            ),

            coreMat
        );


    core.position.set(
        0,
        -0.035 * scale,
        0
    );


    body.add(
        core
    );


    /* ---------- 眼睛 ---------- */

    const eyeMat =
        new THREE.MeshBasicMaterial({
            color:
                0x394039
        });


    const eyes =
        [];


    for (
        const x of [
            -0.085,
            0.085
        ]
    ) {

        const eye =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    0.026 * scale,
                    8,
                    6
                ),

                eyeMat
            );


        eye.position.set(
            x * scale,
            0.055 * scale,
            0.275 * scale
        );


        eye.scale.set(
            0.75,
            1.1,
            0.45
        );


        body.add(
            eye
        );


        eyes.push(
            eye
        );
    }


    /* ======================================================
       动画数据
       ====================================================== */

    root.userData.slime = {

        body:
            body,

        core:
            core,

        eyes:
            eyes,

        pulse:
            Math.random() *
            Math.PI *
            2,

        phase:
            Math.random() *
            Math.PI *
            2
    };


    /* ======================================================
       工作状态
       ====================================================== */

    root.userData.worker = {

        state:
            'idle',

        targetCoin:
            null,

        home:
            new THREE.Vector3(),

        start:
            new THREE.Vector3(),

        target:
            new THREE.Vector3(),

        t:
            0,

        launched:
            false
    };


    return root;
}

/* ==========================================================
   9. 助手
   ========================================================== */

const helpers =
    [];


const helperHomes = [

    [
        -2.5,
        0.14,
        2.2
    ],

    [
        2.5,
        0.14,
        2.2
    ],

    [
        -3.3,
        0.14,
        0.8
    ],

    [
        3.3,
        0.14,
        0.8
    ]
];


const helperColors = [

    0x7ac7b2,

    0xa7c985,

    0x9bb9dc,

    0xd3adcf
];


function syncHelpers(
    count
) {

    while (
        helpers.length <
        count &&
        helpers.length <
        4
    ) {

        const i =
            helpers.length;


        const slime =
            createSlime(
                helperColors[i],
                0.82
            );


        slime.position.set(
            ...helperHomes[i]
        );


        slime
            .userData
            .worker
            .home
            .copy(
                slime.position
            );


        scene.add(
            slime
        );


        helpers.push(
            slime
        );
    }


    helpers.forEach(
        (
            slime,
            index
        ) => {

            slime.visible =
                index <
                count;
        }
    );
}


/* ==========================================================
   10. 史莱姆基础动画
   ========================================================== */

function animateSlime(
    slime,
    time,
    moving = false
) {

    const s =
        slime.userData.slime;


    if (!s) {
        return;
    }


    const pulse =

        moving

            ? Math.sin(
                time * 8 +
                s.pulse
            )

            : Math.sin(
                time * 2 +
                s.pulse
            );


    const sy =

        moving

            ? 0.91 +
              pulse *
              0.06

            : 0.97 +
              pulse *
              0.025;


    const sxz =
        1 /
        Math.sqrt(
            Math.max(
                sy,
                0.1
            )
        );


    s.body.scale.set(
        sxz,
        sy,
        sxz
    );


    s.body.rotation.z =

        Math.sin(
            time *
            (
                moving
                    ? 7
                    : 2.2
            ) +
            s.phase
        ) *

        (
            moving
                ? 0.035
                : 0.012
        );


    s.core.position.y =

        -0.035 +

        Math.sin(
            time *
            1.8 +
            s.pulse
        ) *
        0.012;


    const blink =

        (
            time +
            s.phase
        ) %
        4.4 <
        0.13;


    s.eyes.forEach(
        eye => {

            eye.scale.y =
                blink
                    ? 0.15
                    : 1.1;
        }
    );
}


/* ==========================================================

const coins =

const COIN_SLOTS = [

function createCoin(
    index
) {

    const root =
        new THREE.Group();


    scene.add(
        root
    );


    /*
       第一枚最大，
       后面的仍然明显大于普通硬币
    */

    const radius =
        index === 0
            ? 0.68
            : 0.46;


    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            0.11,
            36
        );


    const mesh =
        new THREE.Mesh(
            geometry,
            M.coin
        );


    root.add(
        mesh
    );


    root.add(

        new THREE.LineSegments(

            new THREE.EdgesGeometry(
                geometry,
                16
            ),

            LINE_MAT
        )
    );


    /* ---------- 硬币内圈 ---------- */

    const ring =
        edge(

            new THREE.TorusGeometry(
                radius *
                0.63,
                0.025,
                6,
                32
            ),

            M.coinDark
        );


    ring.rotation.y =
        Math.PI /
        2;


    ring.position.x =
        0.06;


    root.add(
        ring
    );


    /* ---------- 中央符号 ---------- */

    const star =
        edge(

            new THREE.OctahedronGeometry(
                radius *
                0.22
            ),

            M.coinDark
        );


    star.scale.set(
        1.15,
        0.35,
        1.15
    );


    star.position.x =
        0.065;


    root.add(
        star
    );


    const coin = {

        root:
            root,

        index:
            index,

        radius:
            radius,

        active:
            false,

        done:
            true,

        result:
            null,

        velocity:
            new THREE.Vector3(),

        angular:
            new THREE.Vector3(),

        bounce:
            0
    };


    coins.push(
        coin
    );


    resetCoin(
        coin
    );


    return coin;
}


function resetCoin(
    coin
) {

    const slot =
        COIN_SLOTS[
            coin.index
        ];


    coin.root.position.set(
        slot[0],
        slot[1],
        slot[2]
    );


    coin.root.rotation.set(
        0,
        0,
        Math.PI /
        2
    );


    coin.active =
        false;

    coin.done =
        true;

    coin.result =
        null;

    coin.velocity.set(
        0,
        0,
        0
    );

    coin.angular.set(
        0,
        0,
        0
    );

    coin.bounce =
        0;
}


function syncCoins(
    count
) {

    while (
        coins.length <
        count
    ) {

        createCoin(
            coins.length
        );
    }


    coins.forEach(
        (
            coin,
            index
        ) => {

            coin.root.visible =
                index <
                count;
        }
    );
}


/* ==========================================================
   12. 发射单枚硬币
   ========================================================== */

function launchSingleCoin(
    coin
) {

    if (
        coin.active
    ) {
        return;
    }


    coin.done =
        false;

    coin.active =
        true;

    coin.result =
        null;

    coin.bounce =
        0;


    coin.velocity.set(

        (
            Math.random() -
            0.5
        ) *
        0.6,

        5.8 +
        Math.random() *
        1.2,

        (
            Math.random() -
            0.5
        ) *
        0.5
    );


    coin.angular.set(

        10 +
        Math.random() *
        5,

        4 +
        Math.random() *
        5,

        17 +
        Math.random() *
        8
    );
}


/* ==========================================================
   13. 硬币物理
   ========================================================== */

function updateCoins(
    dt
) {

    for (
        let i = 0;
        i <
        state.coinCount;
        i++
    ) {

        const coin =
            coins[i];


        if (
            !coin.active
        ) {
            continue;
        }


        coin.velocity.y -=
            12.5 *
            dt;


        coin.root.position
            .addScaledVector(
                coin.velocity,
                dt
            );


        coin.root.rotation.x +=
            coin.angular.x *
            dt;


        coin.root.rotation.y +=
            coin.angular.y *
            dt;


        coin.root.rotation.z +=
            coin.angular.z *
            dt;


        const floorY =
            1.32;


        if (
            coin.root.position.y <=
            floorY &&
            coin.velocity.y <
            0
        ) {

            coin.root.position.y =
                floorY;


            if (
                coin.bounce <
                2 &&
                Math.abs(
                    coin.velocity.y
                ) >
                0.8
            ) {

                coin.velocity.y *=
                    -0.33;


                coin.velocity.x *=
                    0.72;


                coin.velocity.z *=
                    0.72;


                coin.angular
                    .multiplyScalar(
                        0.58
                    );


                coin.bounce++;

            } else {

                coin.velocity.set(
                    0,
                    0,
                    0
                );


                coin.angular
                    .multiplyScalar(
                        0.84
                    );


                if (
                    coin.angular.length() <
                    0.7
                ) {

                    settleCoin(
                        coin
                    );
                }
            }
        }
    }
}


/* ==========================================================
   14. 硬币落定
   ========================================================== */

function settleCoin(
    coin
) {

    if (
        coin.done
    ) {
        return;
    }


    /*
       游戏结果使用真正的 50 / 50。
       然后再把模型转到对应朝向。
    */

    coin.result =

        Math.random() <
        0.5

            ? 'HEAD'

            : 'TAIL';


    coin.active =
        false;

    coin.done =
        true;


    coin.root.rotation.set(

        coin.result ===
        'HEAD'

            ? 0
            : Math.PI,

        0,

        Math.PI /
        2
    );


    checkAllCoins();
}


function allCoinsDone() {

    for (
        let i = 0;
        i <
        state.coinCount;
        i++
    ) {

        if (
            !coins[i].done
        ) {

            return false;
        }
    }


    return true;
}


function checkAllCoins() {

    if (
        allCoinsDone()
    ) {

        onCoinsResolved();
    }
}


/* ==========================================================
   15. 史莱姆任务队列
   ========================================================== */

let coinTaskQueue =
    [];


function assignSlimeToCoin(
    slime,
    coin
) {

    const worker =
        slime.userData.worker;


    if (
        worker.state !==
        'idle'
    ) {

        return false;
    }


    worker.state =
        'approach';


    worker.targetCoin =
        coin;


    worker.start.copy(
        slime.position
    );


    worker.target.set(

        coin.root.position.x,

        0.14,

        coin.root.position.z +
        0.72
    );


    worker.t =
        0;


    worker.launched =
        false;


    return true;
}


/* ==========================================================
   16. 给空闲史莱姆派工作
   ========================================================== */

function dispatchCoinTasks() {

    if (
        coinTaskQueue.length ===
        0
    ) {

        return;
    }


    const workers =
        [
            playerSlime,

            ...helpers.filter(
                h =>
                    h.visible
            )
        ];


    for (
        const slime
        of workers
    ) {

        if (
            coinTaskQueue.length ===
            0
        ) {

            break;
        }


        if (
            slime
                .userData
                .worker
                .state !==
            'idle'
        ) {

            continue;
        }


        const coin =
            coinTaskQueue.shift();


        assignSlimeToCoin(
            slime,
            coin
        );
    }
}


/* ==========================================================
   17. 史莱姆操控硬币
   ========================================================== */

function updateWorkerSlime(
    slime,
    dt,
    time
) {

    const worker =
        slime.userData.worker;


    if (!worker) {
        return;
    }


    /* ======================================================
       IDLE
       ====================================================== */

    if (
        worker.state ===
        'idle'
    ) {

        slime.position.y =
            worker.home.y +
            Math.sin(
                time *
                2 +
                slime
                    .userData
                    .slime
                    .phase
            ) *
            0.012;


        animateSlime(
            slime,
            time,
            false
        );


        return;
    }


    /* ======================================================
       APPROACH
       跳向硬币
       ====================================================== */

    if (
        worker.state ===
        'approach'
    ) {

        worker.t +=
            dt /
            0.48;


        const p =
            Math.min(
                worker.t,
                1
            );


        const smooth =
            p *
            p *
            (
                3 -
                2 *
                p
            );


        slime.position.x =

            THREE.MathUtils.lerp(

                worker.start.x,

                worker.target.x,

                smooth
            );


        slime.position.z =

            THREE.MathUtils.lerp(

                worker.start.z,

                worker.target.z,

                smooth
            );


        slime.position.y =

            THREE.MathUtils.lerp(

                worker.start.y,

                worker.target.y,

                smooth
            )

            +

            Math.sin(
                Math.PI *
                p
            ) *
            0.24;


        /*
           朝向硬币
        */

        const dx =

            worker
                .targetCoin
                .root
                .position
                .x

            -

            slime
                .position
                .x;


        const dz =

            worker
                .targetCoin
                .root
                .position
                .z

            -

            slime
                .position
                .z;


        slime.rotation.y =
            Math.atan2(
                dx,
                dz
            );


        animateSlime(
            slime,
            time,
            true
        );


        if (
            p >=
            1
        ) {

            worker.state =
                'charge';

            worker.t =
                0;
        }


        return;
    }


    /* ======================================================
       CHARGE
       压缩蓄力
       ====================================================== */

    if (
        worker.state ===
        'charge'
    ) {

        worker.t +=
            dt;


        const p =
            Math.min(
                worker.t /
                0.30,
                1
            );


        const body =
            slime
                .userData
                .slime
                .body;


        /*
           越来越扁
        */

        body.scale.set(

            1 +
            p *
            0.24,

            1 -
            p *
            0.43,

            1 +
            p *
            0.24
        );


        /*
           身体稍微后仰
        */

        body.rotation.x =
            -p *
            0.12;


        if (
            p >=
            1
        ) {

            worker.state =
                'hit';

            worker.t =
                0;

            worker.launched =
                false;
        }


        return;
    }


    /* ======================================================
       HIT
       弹起并真正顶飞硬币
       ====================================================== */

    if (
        worker.state ===
        'hit'
    ) {

        worker.t +=
            dt;


        const p =
            Math.min(
                worker.t /
                0.22,
                1
            );


        /*
           前半段迅速弹起，
           后半段落下来。
        */

        slime.position.y =

            worker.target.y

            +

            Math.sin(
                Math.PI *
                p
            ) *
            0.38;


        const body =
            slime
                .userData
                .slime
                .body;


        body.scale.set(

            0.90,

            1.25,

            0.90
        );


        /*
           在史莱姆真正顶到硬币的时刻，
           才发射硬币。
        */

        if (
            !worker.launched &&
            p >
            0.32
        ) {

            worker.launched =
                true;


            launchSingleCoin(
                worker.targetCoin
            );
        }


        if (
            p >=
            1
        ) {

            worker.state =
                'recover';

            worker.t =
                0;
        }


        return;
    }


    /* ======================================================
       RECOVER
       落地压缩
       ====================================================== */

    if (
        worker.state ===
        'recover'
    ) {

        worker.t +=
            dt;


        const p =
            Math.min(
                worker.t /
                0.18,
                1
            );


        const body =
            slime
                .userData
                .slime
                .body;


        body.scale.set(

            1.16 -
            p *
            0.16,

            0.72 +
            p *
            0.28,

            1.16 -
            p *
            0.16
        );


        if (
            p >=
            1
        ) {

            worker.state =
                'return';


            worker.start.copy(
                slime.position
            );


            worker.target.copy(
                worker.home
            );


            worker.t =
                0;
        }


        return;
    }


    /* ======================================================
       RETURN
       返回自己的位置
       ====================================================== */

    if (
        worker.state ===
        'return'
    ) {

        worker.t +=
            dt /
            0.55;


        const p =
            Math.min(
                worker.t,
                1
            );


        const smooth =
            p *
            p *
            (
                3 -
                2 *
                p
            );


        slime.position.x =

            THREE.MathUtils.lerp(

                worker.start.x,

                worker.target.x,

                smooth
            );


        slime.position.z =

            THREE.MathUtils.lerp(

                worker.start.z,

                worker.target.z,

                smooth
            );


        slime.position.y =

            THREE.MathUtils.lerp(

                worker.start.y,

                worker.target.y,

                smooth
            )

            +

            Math.sin(
                Math.PI *
                p
            ) *
            0.18;


        animateSlime(
            slime,
            time,
            true
        );


        if (
            p >=
            1
        ) {

            slime.position.copy(
                worker.home
            );


            slime.rotation.y =
                0;


            worker.state =
                'idle';


            worker.targetCoin =
                null;


            /*
               回家以后立刻看看
               队列里还有没有硬币。
            */

            dispatchCoinTasks();
        }
    }
}


/* ==========================================================
   18. 开始史莱姆抛币
   ========================================================== */

function launchCoinsBySlimes() {

    coinTaskQueue =
        [];


    for (
        let i = 0;
        i <
        state.coinCount;
        i++
    ) {

        const coin =
            coins[i];


        resetCoin(
            coin
        );


        /*
           必须先标记成未完成。

           否则第一枚硬币落下时，
           系统可能错误认为所有硬币已经完成。
        */

        coin.done =
            false;


        coinTaskQueue.push(
            coin
        );
    }


    dispatchCoinTasks();
}

/* ==========================================================
   21. 数值
   ========================================================== */

function coinMultiplier() {

    return (
        1.65 +
        (
            state.coinLevel -
            1
        ) *
        0.18
    );
}


function coinCost() {

    return (
        18 *
        state.coinCount *
        state.coinCount
    );
}


function upgradeCost() {

    return (
        25 *
        state.coinLevel
    );
}


function helperCost() {

    return (
        35 +
        state.helperCount *
        30
    );
}

    syncHelpers(

    if (

    ) {

        hintEl.textContent =

}

/* ==========================================================
   24. 开始回合
   ========================================================== */

function startRound() {

    if (
        state.roundActive
    ) {

        return;
    }


    if (
        state.wallet <
        state.stake
    ) {

        showResult(
            '金币不足'
        );

        return;
    }


    state.wallet -=
        state.stake;


    state.roundStart =
        state.stake;


    state.roundValue =
        state.stake;


    state.multiplier =
        1;


    state.roundActive =
        true;


    state.waiting =
        false;


    refreshUI();


    throwRound();
}


/* ==========================================================
   25. 继续抛
   ========================================================== */

function throwRound() {

    if (
        !state.roundActive
    ) {

        return;
    }


    if (
        coinTaskQueue.length >
        0
    ) {

        return;
    }


    state.waiting =
        false;


    refreshUI();


    launchCoinsBySlimes();
}


/* ==========================================================
   26. 所有硬币结果
   ========================================================== */

function onCoinsResolved() {

    let heads =
        0;


    for (
        let i = 0;
        i <
        state.coinCount;
        i++
    ) {

        if (
            coins[i].result ===
            'HEAD'
        ) {

            heads++;
        }
    }


    /*
       一枚正面都没有：
       本轮全部归零
    */

    if (
        heads ===
        0
    ) {

        state.roundValue =
            0;


        state.multiplier =
            1;


        state.roundActive =
            false;


        state.waiting =
            false;


        showResult(
            '全是反面 · 本轮归零'
        );


        refreshUI();


        return;
    }


    const ratio =
        heads /
        state.coinCount;


    const step =

        1 +

        (
            coinMultiplier() -
            1
        ) *

        ratio;


    state.multiplier *=
        step;


    const oldValue =
        state.roundValue;


    state.roundValue =

        Math.max(

            oldValue +
            1,

            Math.round(

                state.roundStart *
                state.multiplier
            )
        );


    const gain =

        state.roundValue -
        oldValue;


    for (
        let i = 0;
        i <
        heads;
        i++
    ) {

        setTimeout(

            () => {

                showGain(

                    '+' +

                    Math.max(
                        1,
                        Math.round(
                            gain /
                            heads
                        )
                    )
                );

            },

            i *
            80
        );
    }


    showResult(

        heads +
        '/' +
        state.coinCount +
        ' 正面 · ×' +
        step.toFixed(
            2
        )
    );


    state.waiting =
        true;


    refreshUI();


    if (
        state.auto &&
        state.helperCount >
        0
    ) {

        state.nextAuto =

            performance.now() *
            0.001 +

            Math.max(

                0.65,

                1.4 -
                state.helperCount *
                0.15
            );
    }
}


/* ==========================================================
   27. 收手
   ========================================================== */

function cashOut() {

    if (
        !state.roundActive ||
        !state.waiting
    ) {

        return;
    }


    state.wallet +=
        state.roundValue;


    showResult(

        '落袋 +' +

        Math.floor(
            state.roundValue
        )
    );


    state.roundActive =
        false;


    state.waiting =
        false;


    state.multiplier =
        1;


    refreshUI();
}


/* ==========================================================
   28. 调整下注
   ========================================================== */

function adjustStake(
    direction
) {

    if (
        state.roundActive
    ) {

        return;
    }


    const values = [
        1,
        2,
        5,
        10,
        20,
        50,
        100
    ];


    let index =
        values.indexOf(
            state.stake
        );


    if (
        index <
        0
    ) {

        index =
            0;
    }


    index =
        clamp(
            index +
            direction,
            0,
            values.length -
            1
        );


    state.stake =
        values[
            index
        ];


    refreshUI();
}


/* ==========================================================
   29. 消费
   ========================================================== */

function spend(
    cost,
    callback,
    message
) {

    if (
        state.wallet <
        cost
    ) {

        showResult(
            '金币不足'
        );

        return;
    }


    state.wallet -=
        cost;


    callback();


    showResult(
        message
    );


    refreshUI();
}

        if (
            state.helperCount ===
            0
        ) {

            showResult(
                '先雇佣史莱姆助手'
            );

            return;
        }


        state.auto =
            !state.auto;


        refreshUI();
    };


/* ==========================================================
   31. 主按钮
   ========================================================== */

mainAction.onclick =
    () => {

        if (
            !state.roundActive
        ) {

            startRound();

        } else if (
            state.waiting
        ) {

            throwRound();
        }
    };


/* ==========================================================
   32. 键盘
   ========================================================== */

addEventListener(
    'keydown',
    event => {

        if (
            event.code ===
            'Space'
        ) {

            event.preventDefault();


            if (
                !state.roundActive
            ) {

                startRound();

            } else if (
                state.waiting
            ) {

                throwRound();
            }
        }


        if (
            event.code ===
            'KeyE'
        ) {

            cashOut();
        }


        if (
            event.code ===
            'KeyQ'
        ) {

            adjustStake(
                -1
            );
        }


        if (
            event.code ===
            'KeyR'
        ) {

            adjustStake(
                1
            );
        }
    }
);


/* ==========================================================
   33. 自动策略
   ========================================================== */

function updateAuto(
    time
) {

    if (
        !state.auto ||
        state.helperCount ===
        0
    ) {

        return;
    }


    if (
        state.roundActive &&
        state.waiting &&
        time >=
        state.nextAuto
    ) {

        throwRound();
    }
}


/* ==========================================================
   34. 相机
   ========================================================== */

let cameraYaw =
    0.05;


let cameraPitch =
    0.26;


let dragging =
    false;


let lastMouseX =
    0;


let lastMouseY =
    0;


renderer.domElement
    .addEventListener(
        'pointerdown',
        event => {

            dragging =
                true;

            lastMouseX =
                event.clientX;

            lastMouseY =
                event.clientY;
        }
    );


addEventListener(
    'pointerup',
    () => {

        dragging =
            false;
    }
);


addEventListener(
    'pointermove',
    event => {

        if (
            !dragging
        ) {

            return;
        }


        cameraYaw -=

            (
                event.clientX -
                lastMouseX
            ) *
            0.0045;


        cameraPitch =

            clamp(

                cameraPitch -

                (
                    event.clientY -
                    lastMouseY
                ) *
                0.0035,

                0.03,

                0.68
            );


        lastMouseX =
            event.clientX;


        lastMouseY =
            event.clientY;
    }
);


function updateCamera(
    dt
) {

    const target =
        new THREE.Vector3(
            0,
            1.55,
            -0.1
        );


    const distance =
        8.8;


    const wanted =
        new THREE.Vector3(

            target.x +

            Math.sin(
                cameraYaw
            ) *

            Math.cos(
                cameraPitch
            ) *

            distance,


            target.y +

            Math.sin(
                cameraPitch
            ) *

            distance,


            target.z +

            Math.cos(
                cameraYaw
            ) *

            Math.cos(
                cameraPitch
            ) *

            distance
        );


    camera.position.lerp(

        wanted,

        Math.min(
            1,
            dt *
            5
        )
    );


    camera.lookAt(
        target
    );
}


/* ==========================================================
   35. Resize
   ========================================================== */

addEventListener(
    'resize',
    () => {

        camera.aspect =

            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* ==========================================================
   36. 主循环
   ========================================================== */

let lastTime =
    0;


function animate(
    milliseconds
) {

    requestAnimationFrame(
        animate
    );


    const time =

        milliseconds *
        0.001;


    const dt =

        Math.min(

            time -
            lastTime,

            0.05
        );


    lastTime =
        time;


    /* ---------- 硬币 ---------- */

    updateCoins(
        dt
    );


    /* ---------- 派发等待中的硬币 ---------- */

    dispatchCoinTasks();


    /* ---------- 玩家史莱姆 ---------- */

    updateWorkerSlime(
        playerSlime,
        dt,
        time
    );


    /* ---------- 助手 ---------- */

    helpers.forEach(
        helper => {

            if (
                helper.visible
            ) {

                updateWorkerSlime(
                    helper,
                    dt,
                    time
                );
            }
        }
    );


    /* ---------- 自动策略 ---------- */

    updateAuto(
        time
    );


    /* ---------- 相机 ---------- */

    updateCamera(
        dt
    );


    renderer.render(
        scene,
        camera
    );
}


/* ==========================================================
   37. 初始化
   ========================================================== */

syncCoins(
    state.coinCount
);


syncHelpers(
    state.helperCount
);


refreshUI();


requestAnimationFrame(
    animate
);

</script>
