      { if: 'merger_alliance', who: 'narration', text: '我选了最省事的一条——出品牌、出资金，跟罐头厂联营，利润两家分。刘处长松了口气，鲁厂长也点头。可日子一长我发现，厂是人家的，产线是人家的，关键时候，我一句话都调不动它。' },

      { who: 'laogongren_a', text: '（挤到前面，嗓门发抖）刘处长，鲁厂长，你们拍拍良心！我们在国营厂干了一辈子，铁饭碗，就这么让一个做饮料的给端了？！' },

      { who: 'you', text: '（没躲，一步一步走到厂门口，站到人堆前，声音不大，但字字清楚）算数。我当着大家的面立三条规矩——第一，2200 人，一个不裁；第二，工资照国营厂的规矩发，今天先把这个月补齐，往后只有早，没有晚；第三，厂子要是亏了，先从我自己的工资里扣，扣到没有，再扣家里的。' },

      { who: 'wangshifu', text: '（边走边甩下一句）……都别堵着了。他说了一个都不裁——咱先看他把产线开起来，再看他把话兑现不兑现。' }

  narration: '旁　白', you: '我', laozong: '老　宗',

};

};

  flags: {}
};

const hintEl = document.getElementById('hint');
const speakerEl = document.getElementById('speaker');
const bgEl = document.getElementById('bg');

const bodyEl = document.body;

const choicesTitle = document.getElementById('choicesTitle');

const bgm = document.getElementById('bgm');

const decisionOptions = document.getElementById('decisionOptions');
const decisionResult = document.getElementById('decisionResult');
const decisionNext = document.getElementById('decisionNext');
const settleBox = document.getElementById('settleBox');
const fogEl = document.getElementById('fog');

let scene = 0;
let idx = -1;
let typing = false;
let finished = false;
let switching = false;
let timer = null;
let stream = null;
let pendingChoice = null;
let choiceIdx = -1;
let pendingDecision = null;
let pendingSettle = null;
let musicOn = false;
let toastTimer = null;
let fogOpen = true;

/* ---- 白雾转场 ---- */
function resetFog(){
  fogOpen = true;
  fogEl.classList.remove('dispersed');
}
function disperseFog(){
  if(!fogOpen) return;
  fogOpen = false;
  fogEl.classList.add('dispersed');
}

function bgFor(S){ return USE_DEBUG_BG ? DEBUG_BG : S.img; }
function getLines(){ return stream; }

function setStream(){
  stream = SCENES[scene].lines.filter(function(l){
    if(l.if && !state.flags[l.if]) return false;
    return true;
  });
}

/* ---- 打字机 ---- */
function typeLine(l){
  const full = l.text;
  let pos = 0;
  typing = true;
  setSpeaker(l.who);
  lineEl.classList.toggle('action', full.charAt(0) === '（');
  hintEl.style.visibility = 'hidden';
  lineEl.textContent = '';
  clearInterval(timer);
  timer = setInterval(function(){
    pos++;
    lineEl.textContent = full.slice(0, pos);
    if(pos < full.length){
      const caret = document.createElement('span');
      caret.className = 'caret';
      lineEl.appendChild(caret);
    }
    if(pos >= full.length){
      clearInterval(timer);
      typing = false;
      if(idx === getLines().length - 1){ finished = true; setEndHint(); }
      hintEl.style.visibility = 'visible';
    }
  }, 55);
}

function finishLine(){
  const ls = getLines();
  if(idx < 0 || idx >= ls.length) return;
  clearInterval(timer);
  lineEl.textContent = ls[idx].text;
  typing = false;
  if(idx === ls.length - 1){ finished = true; setEndHint(); }
  hintEl.style.visibility = 'visible';
}

function setSpeaker(who){
  speakerEl.textContent = WHO_NAME[who] || WHO_NAME.narration;
  speakerEl.className = 'pro-speaker' + (who === 'narration' ? '' : ' ' + who);
}

function setEndHint(){
  if(scene === SCENES.length - 1 || nextSceneIdx() >= SCENES.length){
    hintEl.textContent = '第④部分 · 完 —— 下一篇：非常可乐 · 第⑤部分';
    hintEl.classList.add('done');
    saveStats();
    showNextLink();
  } else {
    hintEl.textContent = '▼ 进入下一幕';
    hintEl.classList.remove('done');
    hideNextLink();
  }
}

/* ---- 数值面板 ---- */
function renderHud(){
  hudStats.innerHTML =
    '<div class="pro-hud-row"><span>现金</span><b>¥' + state.cash + '</b></div>' +
    '<div class="pro-hud-row"><span>声誉</span><b>' + state.reputation + '</b></div>';
}

/* ---- 数值存档 ---- */
function saveStats(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      stats: {
        resilience: state.stats.resilience,
        ahai_bond: state.stats.ahai_bond,
        negotiation_skill: state.stats.negotiation_skill,
        father_bond: state.stats.father_bond,
        cash: state.cash,
        reputation: state.reputation
      },
      flags: state.flags,
      savedAt: new Date().toISOString()
    }));
  }catch(e){}
}

function showNextLink(){
  const a = document.getElementById('nextLink');
  const qs = STAT_ORDER.map(function(k){ return k + '=' + state.stats[k]; })
    .concat(['cash=' + state.cash, 'reputation=' + state.reputation])
    .join('&');
  a.href = NEXT_PAGE + '?' + qs;
  a.hidden = false;
}

function hideNextLink(){ document.getElementById('nextLink').hidden = true; }

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
}

/* ---- 音效 ---- */
function playSfx(path){
  if(!path) return;
  try{
    const a = new Audio(path);
    a.volume = 0.6;
    const p = a.play();
    if(p && p.catch){
      p.catch(function(){ if(path !== '#') toast('音效文件缺失：' + path); });
    }
  }catch(e){
    if(path !== '#') toast('音效文件缺失：' + path);
  }
}

/* ---- 分支选择 ---- */
function showChoices(c){
  pendingChoice = c;
  choiceIdx = idx;
  choicesTitle.textContent = c.prompt;
  choicesList.innerHTML = '';
  c.options.forEach(function(opt){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-choice';
    btn.textContent = opt.label;
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      playSfx(opt.sound);
      pickChoice(opt.key);
    });
    choicesList.appendChild(btn);
  });
  choicesBox.hidden = false;
  renderHud();
}

function pickChoice(key){
  const c = pendingChoice;
  if(!c) return;
  const opt = c.options.find(function(o){ return o.key === key; });
  pendingChoice = null;
  choicesBox.hidden = true;

  if(opt.effects){
    Object.keys(opt.effects).forEach(function(k){
      if(k in state.stats) state.stats[k] += opt.effects[k];
    });
    saveStats();
  }
  Object.assign(state.flags, opt.flags || {});

  const follow = [];
  if(opt.text) follow.push({ who: 'you', text: opt.text });
  if(c.after && c.after[key]){
    follow.push.apply(follow, c.after[key]);
  } else {
    follow.push.apply(follow, getLines().slice(choiceIdx + 1));
  }

  stream = follow;
  idx = -1; typing = false; finished = false;
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}

/* =====================================================================
 * 兼并决策 · 三选一
 * 联营：现金 ×1.2、声誉 +0，无产能底牌
 * 租赁：现金 ×1.4、声誉 +5，无产能底牌
 * 有偿兼并（8000万）：现金 ×0.72、声誉 +15，解锁产能底牌（factory_bonus）
 * ===================================================================== */
const DECISION_OPTIONS = [
  {
    key: 'A',
    label: '联营 · 出品牌出资金',
    desc: '最省事的一条。出品牌、出资金，跟罐头厂联营，利润两家分。',
    result: '你选了最省事的一条——出品牌、出资金，跟罐头厂联营，利润两家分。刘处长松了口气，鲁厂长也点头。可日子一长你发现，厂是人家的，产线是人家的，关键时候，你一句话都调不动它。',
    resultClass: 'safe',
    flag: 'merger_alliance'
  },
  {
    key: 'B',
    label: '租赁 · 租下产线自己管',
    desc: '折中一步。把罐头厂的生产线租下来，自己派人管。',
    result: '你折中一步——把罐头厂的生产线租下来，自己派人管，厂房还是人家的。你自己说了算，产线也转起来了，可职工还是国营的编制，调度起来隔着一层纱，总差着一口气。',
    resultClass: 'safe',
    flag: 'merger_lease'
  },
  {
    key: 'C',
    label: '有偿兼并 · 8000万连人带厂',
    desc: '最狠的一条。砸下8000万，把这座厂、这些机器、这2200口人，连同它的债，整个背过来——家底几乎掏空。',
    result: '你在合同上签下名字那晚，把三个字反复看了很久——"有偿兼并"。这不是租，不是合，是你要把这座厂、这些机器、这2200口人，连同它的债，整个地背到自己肩上。',
    resultClass: 'buyout',
    flag: 'merger_buyout'
  }
];

function startDecision(){
  pendingDecision = true;
  hintEl.style.visibility = 'hidden';
  decisionResult.hidden = true;
  decisionResult.className = 'pro-gamble-result';
  decisionNext.hidden = true;
  decisionOptions.innerHTML = '';
  DECISION_OPTIONS.forEach(function(opt){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-gamble-opt';
    btn.innerHTML = '<span class="opt-label">' + opt.label + '</span><span class="opt-text">' + opt.desc + '</span>';
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      playSfx('#');
      pickDecision(opt.key);
    });
    decisionOptions.appendChild(btn);
  });
  decisionBox.hidden = false;
}

function pickDecision(key){
  Array.prototype.forEach.call(decisionOptions.children, function(b){ b.disabled = true; });
  const opt = DECISION_OPTIONS.find(function(o){ return o.key === key; });
  /* 先清除全部三个分支 flag，避免 localStorage 继承的旧 flag 导致多分支同时生效 */
  delete state.flags.merger_alliance;
  delete state.flags.merger_lease;
  delete state.flags.merger_buyout;
  state.flags[opt.flag] = true;
  decisionResult.className = 'pro-gamble-result ' + opt.resultClass;
  decisionResult.textContent = opt.result;
  decisionResult.hidden = false;
  decisionNext.hidden = false;
}

decisionNext.addEventListener('click', function(ev){
  ev.stopPropagation();
  endDecision();
});

function endDecision(){
  if(!state.flags.merger_alliance && !state.flags.merger_lease && !state.flags.merger_buyout){
    toast('请先选择一条路');
    return;
  }
  pendingDecision = null;
  decisionBox.hidden = true;
  bodyEl.classList.add('has-stats');
  renderHud();
  saveStats();
  setStream();
  idx = -1;
  for(let i = 0; i < stream.length; i++){
    if(stream[i].decision){ idx = i; break; }
  }
  typing = false;
  finished = (idx >= stream.length - 1);
  if(finished) setEndHint();
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}

/* ---- 结算面板（支持现金乘法 + 产能底牌解锁） ---- */
function showSettle(s){
  pendingSettle = s;
  document.getElementById('settleKicker').textContent = s.kicker || '';
  document.getElementById('settleTitle').textContent = s.title || '';
  document.getElementById('settleDesc').textContent = s.desc || '';
  const list = document.getElementById('settleList');
  list.innerHTML = '';
  (s.items || []).forEach(function(it){
    const li = document.createElement('li');
    li.innerHTML = it;
    list.appendChild(li);
  });
  settleBox.hidden = false;
  hintEl.style.visibility = 'hidden';
}

function endSettle(){
  const s = pendingSettle;
  if(!s) return;
  pendingSettle = null;
  settleBox.hidden = true;
  const fx = s.effects || {};
  const parts = [];
  if(fx.cash_mult){
    const old = state.cash;
    state.cash = Math.round(old * fx.cash_mult);
    parts.push('现金 ¥' + old + ' → ¥' + state.cash + '（×' + fx.cash_mult + '）');
  }
  if(fx.reputation){
    state.reputation += fx.reputation;
    parts.push((fx.reputation > 0 ? '+' : '') + fx.reputation + ' 声誉');
  }
  if(fx.factory_bonus){
    state.flags.factory_bonus = true;
    parts.push('解锁「产能底牌」');
  }
  if(parts.length){
    renderHud();
    saveStats();
    toast(parts.join(' · '));
  }
  if(idx === getLines().length - 1){
    finished = true;
    setEndHint();
  }
  hintEl.style.visibility = 'visible';
  advance();
}

document.getElementById('settleNext').addEventListener('click', function(ev){
  ev.stopPropagation();
  endSettle();
});

/* ---- 推进 ---- */
function advance(){
  if(fogOpen) return;
  if(switching) return;
  if(pendingChoice) return;
  if(pendingDecision) return;
  if(pendingSettle) return;
  if(finished){
    if(nextSceneIdx() < SCENES.length) switchScene();
    return;
  }
  if(typing){ finishLine(); return; }
  if(idx < getLines().length - 1){
    idx++;
    const l = getLines()[idx];
    if(l.choice){ showChoices(l.choice); return; }
    if(l.decision){ startDecision(); return; }
    if(l.settle){ showSettle(l.settle); return; }
    if(l.toast){
      toast(l.toast);
      if(idx === getLines().length - 1){
        finished = true;
        setEndHint();
        hintEl.style.visibility = 'visible';
      } else {
        advance();
      }
      return;
    }
    typeLine(l);
  }
}

/* 下一幕索引：跳过尚未满足条件的分支幕 */
function nextSceneIdx(){
  let ns = scene + 1;
  while(ns < SCENES.length && SCENES[ns].if && !state.flags[SCENES[ns].if]) ns++;
  return ns;
}

function preloadNext(){
  const ns = nextSceneIdx();
  if(ns < SCENES.length){
    const im = new Image();
    im.src = bgFor(SCENES[ns]);
  }
}

/* ---- 切换至下一幕 ---- */
function switchScene(){
  if(switching) return;
  const ns = nextSceneIdx();
  if(ns >= SCENES.length) return;
  switching = true;
  scene = ns;
  const S = SCENES[scene];
  stackEl.style.opacity = '0';
  setTimeout(function(){
    bgEl.src = bgFor(S);
    bgEl.alt = S.alt;
    sceneTagEl.textContent = S.tag;
    document.title = S.chapter;
    bodyEl.dataset.scene = String(scene + 1);
    setStream();
    idx = -1; typing = false; finished = false;
    hintEl.classList.remove('done');
    hintEl.textContent = '▼ 点击继续';
    hintEl.style.visibility = 'visible';
    stackEl.style.opacity = '1';
    sceneTagEl.classList.remove('anim');
    void sceneTagEl.offsetWidth;
    sceneTagEl.classList.add('anim');
    preloadNext();
    setTimeout(function(){ switching = false; advance(); }, 1100);
  }, 600);
}

/* ---- 音乐开关 ---- */
function toggleMusic(){
  if(musicOn){
    bgm.pause();
    musicOn = false;
    musicBtn.classList.remove('is-on');
    return;
  }
  const p = bgm.play();
  if(p && p.catch){
    p.catch(function(){
      musicOn = false;
      musicBtn.classList.remove('is-on');
    });
  }
  musicOn = true;
  musicBtn.classList.add('is-on');
}
bgm.addEventListener('error', function(){
  musicOn = false;
  musicBtn.classList.remove('is-on');
});
musicBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleMusic();
});

/* =====================================================================
 * 数值继承（从前序部分继承：心性数值 + 现金 + 声誉 + 分支标志）
 * 优先读取 URL 参数，其次读 localStorage 存档；都没有时从默认值开始。
 * ===================================================================== */
const INHERIT_KEYS = ['resilience', 'ahai_bond', 'negotiation_skill', 'father_bond'];

function loadInherited(){
  const out = {};
  const flags = {};
  let got = false;
  let cash = 0;
  let reputation = 0;
  const qs = new URLSearchParams(location.search);
  INHERIT_KEYS.forEach(function(k){
    const v = qs.get(k);
    if(v !== null && v !== '' && !isNaN(Number(v))){ out[k] = Number(v); got = true; }
  });
  const c = qs.get('cash');
  if(c !== null && c !== '' && !isNaN(Number(c))){ cash = Number(c); got = true; }
  const r = qs.get('reputation');
  if(r !== null && r !== '' && !isNaN(Number(r))){ reputation = Number(r); got = true; }
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.stats){
        INHERIT_KEYS.forEach(function(k){
          if(typeof data.stats[k] === 'number' && !(k in out)){ out[k] = data.stats[k]; got = true; }
        });
        if(typeof data.stats.cash === 'number' && !qs.get('cash')){ cash = data.stats.cash; got = true; }
        if(typeof data.stats.reputation === 'number' && !qs.get('reputation')){ reputation = data.stats.reputation; got = true; }
      }
      if(data && data.flags){ Object.assign(flags, data.flags); }
    }
  }catch(e){}
  /* 若没有继承到现金，给一个默认起始值（广告豪赌后小厂经营所得） */
  if(!got || cash === 0){ cash = 550; reputation = 22; }
  return { out: out, flags: flags, got: got, cash: cash, reputation: reputation };
}

/* ---- 启动 ---- */
const inherited = loadInherited();
if(inherited.got){
  Object.keys(inherited.out).forEach(function(k){ state.stats[k] = inherited.out[k]; });
}
state.cash = inherited.cash;
state.reputation = inherited.reputation;
Object.assign(state.flags, inherited.flags);
/* 清除 part4 决策残留 flag，避免上次游玩或 localStorage 旧数据干扰本次分支 */
delete state.flags.merger_alliance;
delete state.flags.merger_lease;
delete state.flags.merger_buyout;
bodyEl.classList.add('has-stats');
setStream();
bgEl.src = bgFor(SCENES[0]);
renderHud();
setTimeout(advance, 1600);

document.addEventListener('click', function(){
  if(fogOpen){ disperseFog(); return; }
  advance();
});
document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k === ' ' || k === 'enter' || k === 'arrowdown' || k === 'arrowright' || k === 'z'){
    e.preventDefault();
    if(fogOpen){ disperseFog(); return; }
    advance();
  }
  if(k === 'x'){
    e.preventDefault();
    if(typing) finishLine();
  }
});
</script>
