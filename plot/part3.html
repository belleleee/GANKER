/* ---- 白雾转场 ---- */
function resetFog(){
  fogOpen = true;
  fogEl.classList.remove('dispersed');
}
function disperseFog(){
  if(!fogOpen) return;
  fogOpen = false;
  fogEl.classList.add('dispersed');
}
function bgFor(S){ return USE_DEBUG_BG ? DEBUG_BG : S.img; }
function getLines(){ return stream; }
function setStream(){
  stream = SCENES[scene].lines.filter(function(l){
    if(l.if && !state.flags[l.if]) return false;
    return true;
  });
}
/* ---- 打字机 ---- */
function typeLine(l){
  const full = l.text;
  let pos = 0;
  typing = true;
  setSpeaker(l.who);
  lineEl.classList.toggle('action', full.charAt(0) === '（');
  hintEl.style.visibility = 'hidden';
  lineEl.textContent = '';
  clearInterval(timer);
  timer = setInterval(function(){
    pos++;
    lineEl.textContent = full.slice(0, pos);
    if(pos < full.length){
      const caret = document.createElement('span');
      caret.className = 'caret';
      lineEl.appendChild(caret);
    }
    if(pos >= full.length){
      clearInterval(timer);
      typing = false;
      if(idx === getLines().length - 1){ finished = true; setEndHint(); }
      hintEl.style.visibility = 'visible';
    }
  }, 55);
}
function finishLine(){
  const ls = getLines();
  if(idx < 0 || idx >= ls.length) return;
  clearInterval(timer);
  lineEl.textContent = ls[idx].text;
  typing = false;
  if(idx === ls.length - 1){ finished = true; setEndHint(); }
  hintEl.style.visibility = 'visible';
}
function setSpeaker(who){
  speakerEl.textContent = WHO_NAME[who] || WHO_NAME.narration;
  speakerEl.className = 'pro-speaker' + (who === 'narration' ? '' : ' ' + who);
}
function setEndHint(){
  if(scene === SCENES.length - 1){
    hintEl.textContent = '第③部分 · 完 —— 下一篇：兼并国企（1991）';
    hintEl.classList.add('done');
    saveStats();
  } else {
    hintEl.textContent = '▼ 进入下一幕';
    hintEl.classList.remove('done');
  }
}
/* ---- 数值面板 ---- */
function renderHud(){
  hudStats.innerHTML =
    '<div class="pro-hud-row"><span>现金</span><b>¥' + state.cash + '</b></div>' +
    '<div class="pro-hud-row"><span>声誉</span><b>' + state.reputation + '</b></div>';
}
/* ---- 数值存档 ---- */
function saveStats(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      stats: {
        resilience: state.stats.resilience,
        ahai_bond: state.stats.ahai_bond,
        negotiation_skill: state.stats.negotiation_skill,
        father_bond: state.stats.father_bond,
        cash: state.cash,
        reputation: state.reputation
      },
      flags: state.flags,
      savedAt: new Date().toISOString()
    }));
  }catch(e){}
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
}
/* ---- 音效 ---- */
function playSfx(path){
  if(!path) return;
  try{
    const a = new Audio(path);
    a.volume = 0.6;
    const p = a.play();
    if(p && p.catch){
      p.catch(function(){ if(path !== '#') toast('音效文件缺失：' + path); });
    }
  }catch(e){
    if(path !== '#') toast('音效文件缺失：' + path);
  }
}
/* ---- 分支选择 ---- */
function showChoices(c){
  pendingChoice = c;
  choiceIdx = idx;
  choicesTitle.textContent = c.prompt;
  choicesList.innerHTML = '';
  c.options.forEach(function(opt){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-choice';
    btn.textContent = opt.label;
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      playSfx(opt.sound);
      pickChoice(opt.key);
    });
    choicesList.appendChild(btn);
  });
  choicesBox.hidden = false;
  renderHud();
}
function pickChoice(key){
  const c = pendingChoice;
  if(!c) return;
  const opt = c.options.find(function(o){ return o.key === key; });
  pendingChoice = null;
  choicesBox.hidden = true;
  if(opt.effects){
    Object.keys(opt.effects).forEach(function(k){
      if(k in state.stats) state.stats[k] += opt.effects[k];
    });
    saveStats();
  }
  Object.assign(state.flags, opt.flags || {});
  const follow = [];
  if(opt.text) follow.push({ who: 'you', text: opt.text });
  if(c.after && c.after[key]){
    follow.push.apply(follow, c.after[key]);
  } else {
    follow.push.apply(follow, getLines().slice(choiceIdx + 1));
  }
  stream = follow;
  idx = -1; typing = false; finished = false;
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}
/* ---- 配方研制小游戏(#)---- */
function showGame(g){
  pendingGame = g;
  gameLink.textContent = g.label || '配方研制小游戏';
  gameLink.href = g.href || '#';
  gameTip.textContent = g.tip || '';
  lineEl.textContent = '';
  gameBox.hidden = false;
  hintEl.style.visibility = 'hidden';
}
function closeGame(){
  if(!pendingGame) return;
  pendingGame = null;
  gameBox.hidden = true;
  hintEl.style.visibility = 'visible';
  advance();
}
gameLink.addEventListener('click', function(ev){
  ev.preventDefault();
  ev.stopPropagation();
  toast('配方研制小游戏占位链接（#）：选材 → 熬制 → 试喝调试，后续接入');
});
/* =====================================================================
 * 广告豪赌决策
 * 两个选项：豪赌（21万黄金档，80%成功率，不显示概率）/ 稳妥（便宜时段小广告）
 * 豪赌成功：现金 ×5，声誉 +18
 * 豪赌失败：现金 ×0.35（韧性 >= 阈值时 ×0.55），声誉 −6
 * 稳妥：现金 ×1.5，声誉 +4
 * ===================================================================== */
const GAMBLE_OPTIONS = [
  { key: 'A', label: '豪赌 · 21 万黄金时段', text: '21 万，黄金时段。我签。', desc: '一夜之间，全城皆知——成了一步登天，败了倾家荡产。' },
  { key: 'B', label: '稳妥 · 便宜时段小广告', text: '先上便宜时段的广告，稳扎稳打。', desc: '钱省一半还多，观众少些、来得慢些，但账本上第一行写着"稳"。' }
];
function startGamble(){
  pendingGamble = true;
  hintEl.style.visibility = 'hidden';
  gambleResult.hidden = true;
  gambleResult.className = 'pro-gamble-result';
  gambleNext.hidden = true;
  gambleOptions.innerHTML = '';
  GAMBLE_OPTIONS.forEach(function(opt){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-gamble-opt';
    btn.innerHTML = '<span class="opt-label">' + opt.label + '</span><span class="opt-text">' + opt.desc + '</span>';
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      playSfx('#');
      pickGamble(opt.key);
    });
    gambleOptions.appendChild(btn);
  });
  gambleBox.hidden = false;
}
function pickGamble(key){
  /* 禁用所有选项 */
  Array.prototype.forEach.call(gambleOptions.children, function(b){ b.disabled = true; });
  /* 先清除全部三个豪赌分支 flag，避免 localStorage 继承的旧 flag 导致多分支同时生效 */
  delete state.flags.gamble_win;
  delete state.flags.gamble_lose;
  delete state.flags.gamble_safe;
  if(key === 'A'){
    /* 豪赌：80% 成功率 */
    const win = Math.random() < GAMBLE_WIN_RATE;
    if(win){
      state.flags.gamble_win = true;
      gambleResult.className = 'pro-gamble-result win';
      gambleResult.textContent = '你签下了 21 万黄金时段的合同。广告播出后，全城一夜之间都知道了"娃哈哈"——豪赌成功。';
    } else {
      state.flags.gamble_lose = true;
      gambleResult.className = 'pro-gamble-result lose';
      const resilient = state.stats.resilience >= RESILIENCE_THRESHOLD;
      gambleResult.textContent = resilient
        ? '黄金时段的广告播了，销量却没能在头几天暴涨。好在你早年攒下的韧性够硬，咬着牙一笔一笔还，总算缓过一口气。'
        : '黄金时段的广告播了，销量却没能在头几天暴涨。账上见了底，经销部的灯连着几个月亮到半夜——这一关，得硬扛。';
    }
  } else {
    /* 稳妥 */
    state.flags.gamble_safe = true;
    gambleResult.className = 'pro-gamble-result safe';
    gambleResult.textContent = '你把 21 万的合同推了回去，改签了便宜时段的广告。广告照做照播，只是观众少些、来得慢些——稳扎稳打。';
  }
  gambleResult.hidden = false;
  gambleNext.hidden = false;
}
gambleNext.addEventListener('click', function(ev){
  ev.stopPropagation();
  endGamble();
});
function endGamble(){
  /* 未选择任何选项时，不允许继续，提示玩家先选择 */
  if(!state.flags.gamble_win && !state.flags.gamble_lose && !state.flags.gamble_safe){
    toast('请先选择一个选项');
    return;
  }
  pendingGamble = null;
  gambleBox.hidden = true;
  bodyEl.classList.add('has-stats');
  renderHud();
  setStream();
  idx = -1;
  for(let i = 0; i < stream.length; i++){
    if(stream[i].gamble){ idx = i; break; }
  }
  typing = false;
  finished = (idx >= stream.length - 1);
  if(finished) setEndHint();
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}
/* ---- 结算面板（支持现金乘法） ---- */
function showSettle(s){
  pendingSettle = s;
  document.getElementById('settleKicker').textContent = s.kicker || '';
  document.getElementById('settleTitle').textContent = s.title || '';
  document.getElementById('settleDesc').textContent = s.desc || '';
  const list = document.getElementById('settleList');
  list.innerHTML = '';
  (s.items || []).forEach(function(it){
    const li = document.createElement('li');
    li.innerHTML = it;
    list.appendChild(li);
  });
  settleBox.hidden = false;
  hintEl.style.visibility = 'hidden';
}
function endSettle(){
  const s = pendingSettle;
  if(!s) return;
  pendingSettle = null;
  settleBox.hidden = true;
  const fx = s.effects || {};
  const parts = [];
  if(fx.cash_mult){
    const old = state.cash;
    state.cash = Math.round(old * fx.cash_mult);
    parts.push('现金 ' + (old > 0 ? '¥' + old + ' → ¥' + state.cash : '×' + fx.cash_mult));
  }
  if(fx.cash_mult_lose){
    const old = state.cash;
    const mult = (state.stats.resilience >= RESILIENCE_THRESHOLD) ? 0.55 : 0.35;
    state.cash = Math.round(old * mult);
    parts.push('现金 ¥' + old + ' → ¥' + state.cash + '（×' + mult + '）');
  }
  if(fx.reputation){
    state.reputation += fx.reputation;
    parts.push((fx.reputation > 0 ? '+' : '') + fx.reputation + ' 声誉');
  }
  if(parts.length){
    renderHud();
    saveStats();
    toast(parts.join(' · '));
  }
  if(idx === getLines().length - 1){
    finished = true;
    setEndHint();
  }
  hintEl.style.visibility = 'visible';
  advance();
}
document.getElementById('settleNext').addEventListener('click', function(ev){
  ev.stopPropagation();
  endSettle();
});
/* ---- 推进 ---- */
function advance(){
  if(fogOpen) return;
  if(switching) return;
  if(pendingChoice) return;
  if(pendingGamble) return;
  if(pendingSettle) return;
  if(pendingGame){ closeGame(); return; }
  if(finished){
    if(scene < SCENES.length - 1) switchScene();
    return;
  }
  if(typing){ finishLine(); return; }
  if(idx < getLines().length - 1){
    idx++;
    const l = getLines()[idx];
    if(l.choice){ showChoices(l.choice); return; }
    if(l.game){ showGame(l.game); return; }
    if(l.gamble){ startGamble(); return; }
    if(l.settle){ showSettle(l.settle); return; }
    if(l.toast){
      toast(l.toast);
      if(idx === getLines().length - 1){
        finished = true;
        setEndHint();
        hintEl.style.visibility = 'visible';
      } else {
        advance();
      }
      return;
    }
    typeLine(l);
  }
}
function preloadNext(){
  if(scene + 1 < SCENES.length){
    const im = new Image();
    im.src = bgFor(SCENES[scene + 1]);
  }
}
/* ---- 切换至下一幕 ---- */
function switchScene(){
  if(switching) return;
  if(scene >= SCENES.length - 1) return;
  switching = true;
  scene++;
  const S = SCENES[scene];
  stackEl.style.opacity = '0';
  setTimeout(function(){
    bgEl.src = bgFor(S);
    bgEl.alt = S.alt;
    sceneTagEl.textContent = S.tag;
    document.title = S.chapter;
    bodyEl.dataset.scene = String(scene + 1);
    setStream();
    idx = -1; typing = false; finished = false;
    hintEl.classList.remove('done');
    hintEl.textContent = '▼ 点击继续';
    hintEl.style.visibility = 'visible';
    stackEl.style.opacity = '1';
    sceneTagEl.classList.remove('anim');
    void sceneTagEl.offsetWidth;
    sceneTagEl.classList.add('anim');
    preloadNext();
    setTimeout(function(){ switching = false; advance(); }, 1100);
  }, 600);
}
/* ---- 音乐开关 ---- */
function toggleMusic(){
  if(musicOn){
    bgm.pause();
    musicOn = false;
    musicBtn.classList.remove('is-on');
    return;
  }
  const p = bgm.play();
  if(p && p.catch){
    p.catch(function(){
      musicOn = false;
      musicBtn.classList.remove('is-on');
    });
  }
  musicOn = true;
  musicBtn.classList.add('is-on');
}
bgm.addEventListener('error', function(){
  musicOn = false;
  musicBtn.classList.remove('is-on');
});
musicBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleMusic();
});
/* =====================================================================
 * 数值继承（从前序部分继承：心性数值 + 现金 + 声誉 + 分支标志）
 * 优先读取 URL 参数，其次读 localStorage 存档；都没有时从默认值开始。
 * ===================================================================== */
const INHERIT_KEYS = ['resilience', 'ahai_bond', 'negotiation_skill', 'father_bond'];
function loadInherited(){
  const out = {};
  const flags = {};
  let got = false;
  let cash = 0;
  let reputation = 0;
  const qs = new URLSearchParams(location.search);
  INHERIT_KEYS.forEach(function(k){
    const v = qs.get(k);
    if(v !== null && v !== '' && !isNaN(Number(v))){ out[k] = Number(v); got = true; }
  });
  const c = qs.get('cash');
  if(c !== null && c !== '' && !isNaN(Number(c))){ cash = Number(c); got = true; }
  const r = qs.get('reputation');
  if(r !== null && r !== '' && !isNaN(Number(r))){ reputation = Number(r); got = true; }
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.stats){
        INHERIT_KEYS.forEach(function(k){
          if(typeof data.stats[k] === 'number' && !(k in out)){ out[k] = data.stats[k]; got = true; }
        });
        if(typeof data.stats.cash === 'number' && !qs.get('cash')){ cash = data.stats.cash; got = true; }
        if(typeof data.stats.reputation === 'number' && !qs.get('reputation')){ reputation = data.stats.reputation; got = true; }
      }
      if(data && data.flags){ Object.assign(flags, data.flags); }
    }
  }catch(e){}
  /* 若没有继承到现金，给一个默认起始值（经销部一年经营所得） */
  if(!got || cash === 0){ cash = 110; reputation = 4; }
  return { out: out, flags: flags, got: got, cash: cash, reputation: reputation };
}
/* ---- 启动 ---- */
const inherited = loadInherited();
if(inherited.got){
  Object.keys(inherited.out).forEach(function(k){ state.stats[k] = inherited.out[k]; });
}
state.cash = inherited.cash;
state.reputation = inherited.reputation;
Object.assign(state.flags, inherited.flags);
/* 清除 part3 豪赌决策残留 flag，避免上次游玩或 localStorage 旧数据干扰本次分支 */
delete state.flags.gamble_win;
delete state.flags.gamble_lose;
delete state.flags.gamble_safe;
bodyEl.classList.add('has-stats');
setStream();
bgEl.src = bgFor(SCENES[0]);
renderHud();
setTimeout(advance, 1600);
document.addEventListener('click', function(){
  if(fogOpen){ disperseFog(); return; }
  advance();
});
document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k === ' ' || k === 'enter' || k === 'arrowdown' || k === 'arrowright' || k === 'z'){
    e.preventDefault();
    if(fogOpen){ disperseFog(); return; }
    advance();
  }
  if(k === 'x'){
    e.preventDefault();
    if(typing) finishLine();
  }
});
</script>
