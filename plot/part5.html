  fogEl.classList.add('dispersed');
}

function bgFor(S){ return USE_DEBUG_BG ? DEBUG_BG : S.img; }
function getLines(){ return stream; }

function setStream(){
  stream = SCENES[scene].lines.filter(function(l){
    if(l.if && !state.flags[l.if]) return false;
    if(l.ifAll){
      for(var i = 0; i < l.ifAll.length; i++){
        if(!state.flags[l.ifAll[i]]) return false;
      }
    }
    return true;
  });
}

/* ---- 打字机 ---- */
function typeLine(l){
  const full = l.text;
  let pos = 0;
  typing = true;
  setSpeaker(l.who);
  lineEl.classList.toggle('action', full.charAt(0) === '（');
  hintEl.style.visibility = 'hidden';
  lineEl.textContent = '';
  clearInterval(timer);
  timer = setInterval(function(){
    pos++;
    lineEl.textContent = full.slice(0, pos);
    if(pos < full.length){
      const caret = document.createElement('span');
      caret.className = 'caret';
      lineEl.appendChild(caret);
    }
    if(pos >= full.length){
      clearInterval(timer);
      typing = false;
      if(idx === getLines().length - 1){ finished = true; setEndHint(); }
      hintEl.style.visibility = 'visible';
    }
  }, 55);
}

function finishLine(){
  const ls = getLines();
  if(idx < 0 || idx >= ls.length) return;
  clearInterval(timer);
  lineEl.textContent = ls[idx].text;
  typing = false;
  if(idx === getLines().length - 1){ finished = true; setEndHint(); }
  hintEl.style.visibility = 'visible';
}

function setSpeaker(who){
  speakerEl.textContent = WHO_NAME[who] || WHO_NAME.narration;
  speakerEl.className = 'pro-speaker' + (who === 'narration' ? '' : ' ' + who);
}

function setEndHint(){
  if(scene === SCENES.length - 1){
    hintEl.textContent = '第⑤部分 · 完 —— 下一篇：达能之争 · 逐字读合同（2007）';
    hintEl.classList.add('done');
    saveStats();
    showNextLink();
  } else {
    hintEl.textContent = '▼ 进入下一幕';
    hintEl.classList.remove('done');
    hideNextLink();
  }
}

/* ---- 数值面板 ---- */
function renderHud(){
  hudStats.innerHTML =
    '<div class="pro-hud-row"><span>现金</span><b>¥' + state.cash + '</b></div>' +
    '<div class="pro-hud-row"><span>声誉</span><b>' + state.reputation + '</b></div>';
}

/* ---- 数值存档（供下一篇继承） ---- */
function saveStats(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      stats: {
        resilience: state.stats.resilience,
        ahai_bond: state.stats.ahai_bond,
        negotiation_skill: state.stats.negotiation_skill,
        father_bond: state.stats.father_bond,
        cash: state.cash,
        reputation: state.reputation
      },
      flags: state.flags,
      savedAt: new Date().toISOString()
    }));
  }catch(e){}
}

function showNextLink(){
  const a = document.getElementById('nextLink');
  const qs = STAT_ORDER.map(function(k){ return k + '=' + state.stats[k]; })
    .concat(['cash=' + state.cash, 'reputation=' + state.reputation])
    .join('&');
  a.href = NEXT_PAGE + '?' + qs;
  a.hidden = false;
}

function hideNextLink(){ document.getElementById('nextLink').hidden = true; }

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
}

/* ---- 音效 ---- */
function playSfx(path){
  if(!path) return;
  try{
    const a = new Audio(path);
    a.volume = 0.6;
    const p = a.play();
    if(p && p.catch){
      p.catch(function(){ if(path !== '#') toast('音效文件缺失：' + path); });
    }
  }catch(e){
    if(path !== '#') toast('音效文件缺失：' + path);
  }
}

/* ---- 分支选择 ---- */
function showChoices(c){
  pendingChoice = c;
  choiceIdx = idx;
  choicesTitle.textContent = c.prompt;
  choicesList.innerHTML = '';
  c.options.forEach(function(opt){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-choice';
    btn.textContent = opt.label;
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      playSfx(opt.sound);
      pickChoice(opt.key);
    });
    choicesList.appendChild(btn);
  });
  choicesBox.hidden = false;
  renderHud();
}

function pickChoice(key){
  const c = pendingChoice;
  if(!c) return;
  const opt = c.options.find(function(o){ return o.key === key; });
  pendingChoice = null;
  choicesBox.hidden = true;

  if(opt.effects){
    Object.keys(opt.effects).forEach(function(k){
      if(k in state.stats) state.stats[k] += opt.effects[k];
    });
    saveStats();
  }
  Object.assign(state.flags, opt.flags || {});

  const follow = [];
  if(opt.text) follow.push({ who: 'you', text: opt.text });
  if(c.after && c.after[key]){
    follow.push.apply(follow, c.after[key]);
  } else {
    follow.push.apply(follow, getLines().slice(choiceIdx + 1));
  }

  stream = follow;
  idx = -1; typing = false; finished = false;
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}

/* =====================================================================
 * 可乐对垒 · 三轮比点（田忌赛马）
 * 两乐按【品牌积淀】【资金实力】【一二线渠道】出牌；
 * 你的【渠道深耕】压【品牌积淀】、【人情关系】压【资金实力】、【下沉市场】压【一二线渠道】。
 * 三轮中至少赢两轮，即对垒胜出（主线）；否则对垒落败（次要分支）。
 * 若第④部分带产能底牌（factory_bonus），胜出时现金 ×5（基础 ×4 ×1.25）。
 * ===================================================================== */
const DUEL_OPP = [
  { key: '品牌积淀', desc: '一百年的牌子，压得人抬不起头', hint: '一百年的老牌子，最怕有人把牌子攒在路上——走了十几年的路，认得每一户人家的门。' },
  { key: '资金实力', desc: '烧钱，广告铺天盖地', hint: '烧钱砸广告的人，最怕有人烧的是腿——钱能买来版面，买不来店门口那个招呼。' },
  { key: '一二线渠道', desc: '守死了城里的黄金货架', hint: '守死城里货架的人，最怕有人绕到后院——中国最广的地方，不只在城里。' }
];
const DUEL_MINE = [
  { key: '渠道深耕', desc: '十几年走出来的路，认得每一户人家的门' },
  { key: '人情关系', desc: '钱买不来的交情，越处越厚' },
  { key: '下沉市场', desc: '城里货架让给你，乡镇是我的地盘' }
];
const DUEL_BEATS = { '渠道深耕': '品牌积淀', '人情关系': '资金实力', '下沉市场': '一二线渠道' };
/* 每轮胜出时的台词（取自文案） */
const DUEL_WIN_LINES = [
  '（站在那条通往乡镇的土路上）牌子是攒出来的。你的攒在广告上，我的是攒在路上——这条路，我走了十几年，认得每一户人家的门。',
  '你烧的是钱，我烧的是腿。钱能买来版面，买不来人家店门口那个招呼——钱花完就没了，交情，越处越厚。',
  '（指着地图上密密麻麻的红点）城里的货架，我让给你。可中国人最广的那片地方，不只在城里——中国孩子的舌头爱喝什么，你未必比我懂。'
];

let duelRound = 0;
let duelWins = 0;
let duelUsed = [];

function startDuel(){
  duelOpen = true;
  duelRound = 0;
  duelWins = 0;
  duelUsed = [];
  hintEl.style.visibility = 'hidden';
  document.getElementById('duelLog').textContent = '';
  document.getElementById('duelResult').hidden = true;
  document.getElementById('duelNext').hidden = true;
  renderDuelCards();
  showDuelRound();
  duelBox.hidden = false;
}

function renderDuelCards(){
  const box = document.getElementById('duelCards');
  box.innerHTML = '';
  DUEL_MINE.forEach(function(c){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-duel-card pick';
    btn.dataset.key = c.key;
    btn.innerHTML = '<b>' + c.key + '</b><span>' + c.desc + '</span>';
    btn.addEventListener('click', function(){ pickDuelCard(c.key, btn); });
    box.appendChild(btn);
  });
}

function showDuelRound(){
  document.getElementById('duelRound').textContent = String(duelRound + 1);
  const opp = DUEL_OPP[duelRound];
  document.getElementById('oppKey').textContent = opp.key;
  document.getElementById('oppDesc').textContent = opp.desc;
  document.getElementById('duelHint').textContent = '两乐打出【' + opp.key + '】——' + opp.hint;
  document.getElementById('duelOpp').className = 'pro-duel-card opp';
  document.querySelectorAll('#duelCards .pro-duel-card').forEach(function(el){
    el.disabled = false;
    el.classList.remove('used', 'win', 'lose');
  });
}

function pickDuelCard(key, el){
  if(duelUsed.indexOf(key) >= 0) return;
  duelUsed.push(key);
  document.querySelectorAll('#duelCards .pro-duel-card').forEach(function(b){ b.disabled = true; });
  const opp = DUEL_OPP[duelRound];
  const win = DUEL_BEATS[key] === opp.key;
  if(win) duelWins++;
  const oppEl = document.getElementById('duelOpp');
  oppEl.className = 'pro-duel-card opp ' + (win ? 'lose' : 'win');
  el.classList.remove('pick');
  el.classList.add(win ? 'win' : 'lose');
  const logText = win
    ? '第' + (duelRound + 1) + '轮：你的【' + key + '】压过了两乐的【' + opp.key + '】——你胜。'
    : '第' + (duelRound + 1) + '轮：你的【' + key + '】没能压过两乐的【' + opp.key + '】——你负。';
  document.getElementById('duelLog').textContent = logText;
  /* 胜出时播放对应台词 */
  if(win){
    typeLine({ who: 'you', text: DUEL_WIN_LINES[duelRound] });
  }
  setTimeout(function(){
    duelRound++;
    if(duelRound < 3) showDuelRound();
    else finishDuel();
  }, win ? 2800 : 1200);
}

function finishDuel(){
  const win = duelWins >= 2;
  const box = document.getElementById('duelResult');
  box.hidden = false;
  box.className = 'pro-duel-result ' + (win ? 'win' : 'lose');
  if(win && state.flags.factory_bonus){
    box.textContent = '三轮对垒，你以巧取胜——罐头厂的大产线全力灌装，不怕断货。下沉市场，动了。';
  } else if(win){
    box.textContent = '三轮对垒，你以巧取胜——两乐的牌，一张张被你压了下去。下沉市场，动了。';
  } else {
    box.textContent = '三轮对垒，你落了下风——两乐的品牌与渠道，压过了你的牌面。可乡镇的根，已经扎下了。';
  }
  const next = document.getElementById('duelNext');
  next.hidden = false;
  next.onclick = function(){ endDuel(win); };
}

function endDuel(win){
  duelOpen = false;
  duelBox.hidden = true;
  const effects = win ? { negotiation_skill: 10, resilience: 5 } : { resilience: 5 };
  applyEffects(effects);
  toastEffects(effects);
  state.flags[win ? 'duel_win' : 'duel_lose'] = true;
  bodyEl.classList.add('has-stats');
  renderHud();
  saveStats();
  setStream();
  idx = -1;
  for(let i = 0; i < stream.length; i++){
    if(stream[i].duel){ idx = i; break; }
  }
  typing = false;
  finished = (idx >= stream.length - 1);
  if(finished) setEndHint();
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}

function applyEffects(effects){
  if(!effects) return;
  Object.keys(effects).forEach(function(k){
    if(k in state.stats) state.stats[k] += effects[k];
  });
  renderHud();
}

function toastEffects(effects){
  if(!effects) return;
  const parts = [];
  Object.keys(effects).forEach(function(k){
    if(!(k in STAT_NAME)) return;
    const v = effects[k];
    parts.push((v > 0 ? '+' : '') + v + ' ' + STAT_NAME[k]);
  });
  if(parts.length) toast(parts.join(' · '));
}

/* ---- 结算面板（支持现金乘法 + 产能底牌加成） ---- */
function showSettle(s){
  pendingSettle = s;
  document.getElementById('settleKicker').textContent = s.kicker || '';
  document.getElementById('settleTitle').textContent = s.title || '';
  document.getElementById('settleDesc').textContent = s.desc || '';
  const list = document.getElementById('settleList');
  list.innerHTML = '';
  (s.items || []).forEach(function(it){
    const li = document.createElement('li');
    li.innerHTML = it;
    list.appendChild(li);
  });
  settleBox.hidden = false;
  hintEl.style.visibility = 'hidden';
}

function endSettle(){
  const s = pendingSettle;
  if(!s) return;
  pendingSettle = null;
  settleBox.hidden = true;
  const fx = s.effects || {};
  const parts = [];
  if(fx.cash_mult_cola_win){
    /* 非常可乐胜出：基础 ×4，带产能底牌时 ×5（×4 ×1.25） */
    const mult = state.flags.factory_bonus ? 5 : 4;
    const old = state.cash;
    state.cash = Math.round(old * mult);
    parts.push('现金 ¥' + old + ' → ¥' + state.cash + '（×' + mult + (state.flags.factory_bonus ? '，产能底牌加成' : '') + '）');
  }
  if(fx.cash_mult){
    const old = state.cash;
    state.cash = Math.round(old * fx.cash_mult);
    parts.push('现金 ¥' + old + ' → ¥' + state.cash + '（×' + fx.cash_mult + '）');
  }
  if(fx.reputation){
    state.reputation += fx.reputation;
    parts.push((fx.reputation > 0 ? '+' : '') + fx.reputation + ' 声誉');
  }
  if(parts.length){
    renderHud();
    saveStats();
    toast(parts.join(' · '));
  }
  if(idx === getLines().length - 1){
    finished = true;
    setEndHint();
  }
  hintEl.style.visibility = 'visible';
  advance();
}

document.getElementById('settleNext').addEventListener('click', function(ev){
  ev.stopPropagation();
  endSettle();
});

/* ---- 推进 ---- */
function advance(){
  if(fogOpen) return;
  if(switching) return;
  if(pendingChoice) return;
  if(duelOpen) return;
  if(pendingSettle) return;
  if(finished){
    if(scene < SCENES.length - 1) switchScene();
    return;
  }
  if(typing){ finishLine(); return; }
  if(idx < getLines().length - 1){
    idx++;
    const l = getLines()[idx];
    if(l.choice){ showChoices(l.choice); return; }
    if(l.duel){ startDuel(); return; }
    if(l.settle){ showSettle(l.settle); return; }
    if(l.toast){
      toast(l.toast);
      if(idx === getLines().length - 1){
        finished = true;
        setEndHint();
        hintEl.style.visibility = 'visible';
      } else {
        advance();
      }
      return;
    }
    typeLine(l);
  }
}

function preloadNext(){
  if(scene + 1 < SCENES.length){
    const im = new Image();
    im.src = bgFor(SCENES[scene + 1]);
  }
}

/* ---- 切换至下一幕 ---- */
function switchScene(){
  if(switching) return;
  if(scene >= SCENES.length - 1) return;
  switching = true;
  scene++;
  const S = SCENES[scene];
  stackEl.style.opacity = '0';
  setTimeout(function(){
    bgEl.src = bgFor(S);
    bgEl.alt = S.alt;
    sceneTagEl.textContent = S.tag;
    document.title = S.chapter;
    bodyEl.dataset.scene = String(scene + 1);
    setStream();
    idx = -1; typing = false; finished = false;
    hintEl.classList.remove('done');
    hintEl.textContent = '▼ 点击继续';
    hintEl.style.visibility = 'visible';
    stackEl.style.opacity = '1';
    sceneTagEl.classList.remove('anim');
    void sceneTagEl.offsetWidth;
    sceneTagEl.classList.add('anim');
    preloadNext();
    setTimeout(function(){ switching = false; advance(); }, 1100);
  }, 600);
}

/* ---- 音乐开关 ---- */
function toggleMusic(){
  if(musicOn){
    bgm.pause();
    musicOn = false;
    musicBtn.classList.remove('is-on');
    return;
  }
  const p = bgm.play();
  if(p && p.catch){
    p.catch(function(){
      musicOn = false;
      musicBtn.classList.remove('is-on');
    });
  }
  musicOn = true;
  musicBtn.classList.add('is-on');
}
bgm.addEventListener('error', function(){
  musicOn = false;
  musicBtn.classList.remove('is-on');
});
musicBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleMusic();
});

/* =====================================================================
 * 数值继承（从前序部分继承：心性数值 + 现金 + 声誉 + 分支标志）
 * 优先读取 URL 参数，其次读 localStorage 存档；都没有时从默认值开始。
 * 产能底牌（factory_bonus）从 flags 中读取，影响非常可乐胜出时的现金倍率。
 * ===================================================================== */
const INHERIT_KEYS = ['resilience', 'ahai_bond', 'negotiation_skill', 'father_bond'];

function loadInherited(){
  const out = {};
  const flags = {};
  let got = false;
  let cash = 0;
  let reputation = 0;
  const qs = new URLSearchParams(location.search);
  INHERIT_KEYS.forEach(function(k){
    const v = qs.get(k);
    if(v !== null && v !== '' && !isNaN(Number(v))){ out[k] = Number(v); got = true; }
  });
  const c = qs.get('cash');
  if(c !== null && c !== '' && !isNaN(Number(c))){ cash = Number(c); got = true; }
  const r = qs.get('reputation');
  if(r !== null && r !== '' && !isNaN(Number(r))){ reputation = Number(r); got = true; }
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.stats){
        INHERIT_KEYS.forEach(function(k){
          if(typeof data.stats[k] === 'number' && !(k in out)){ out[k] = data.stats[k]; got = true; }
        });
        if(typeof data.stats.cash === 'number' && !qs.get('cash')){ cash = data.stats.cash; got = true; }
        if(typeof data.stats.reputation === 'number' && !qs.get('reputation')){ reputation = data.stats.reputation; got = true; }
      }
      if(data && data.flags){ Object.assign(flags, data.flags); }
    }
  }catch(e){}
  /* 若没有继承到现金，给一个默认起始值（兼并后经营所得） */
  if(!got || cash === 0){ cash = 800; reputation = 30; }
  return { out: out, flags: flags, got: got, cash: cash, reputation: reputation };
}

/* ---- 启动 ---- */
const inherited = loadInherited();
if(inherited.got){
  Object.keys(inherited.out).forEach(function(k){ state.stats[k] = inherited.out[k]; });
}
state.cash = inherited.cash;
state.reputation = inherited.reputation;
Object.assign(state.flags, inherited.flags);
/* 清除 part5 对垒残留 flag，避免上次游玩或 localStorage 旧数据干扰本次分支 */
delete state.flags.duel_win;
delete state.flags.duel_lose;
bodyEl.classList.add('has-stats');
setStream();
bgEl.src = bgFor(SCENES[0]);
renderHud();
if(inherited.flags.factory_bonus){
  toast('已继承「产能底牌」：非常可乐胜出时现金 ×5');
}
setTimeout(advance, 1600);

document.addEventListener('click', function(){
  if(fogOpen){ disperseFog(); return; }
  advance();
});
document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k === ' ' || k === 'enter' || k === 'arrowdown' || k === 'arrowright' || k === 'z'){
    e.preventDefault();
    if(fogOpen){ disperseFog(); return; }
    advance();
  }
  if(k === 'x'){
    e.preventDefault();
    if(typing) finishLine();
  }
});
</script>
