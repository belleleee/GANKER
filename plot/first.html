  narration: '旁　白', mother: '母　亲', father: '父　亲', grandfather: '祖　父',
  you: '你', ahai: '阿　海', captain: '队长老陈', guide: '农场接引员',
  tallboy: '高个子知青', zhaobo: '赵　伯', xiulan: '秀　兰', messenger: '捎话的人'
};
const STAT_NAME = {
  resilience: '坚韧', ahai_bond: '与阿海的情谊', negotiation_skill: '谈判', father_bond: '与父亲的羁绊'
};
const STAT_ORDER = ['resilience', 'ahai_bond', 'negotiation_skill', 'father_bond'];

const state = {
  stats: { resilience: 0, ahai_bond: 0, negotiation_skill: 0, father_bond: 0 },
  flags: {}
};

const lineEl = document.getElementById('line');
const hintEl = document.getElementById('hint');
const speakerEl = document.getElementById('speaker');
const bgEl = document.getElementById('bg');
const sceneTagEl = document.getElementById('sceneTag');
const stackEl = document.getElementById('bgStack');
const bodyEl = document.body;
const chapterBox = null;
const chapterText = null;
const choicesBox = document.getElementById('choicesBox');
const choicesTitle = document.getElementById('choicesTitle');
const choicesList = document.getElementById('choicesList');
const hudStats = document.getElementById('hudStats');
const toastEl = document.getElementById('toast');
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');

let scene = 0;             /* 当前幕索引 */
let idx = -1;              /* 当前行索引（-1 表示尚未开始） */
let typing = false;
let finished = false;      /* 当前幕是否已到末行 */
let switching = false;     /* 幕切换空档期锁：期间忽略所有输入，防止连点跳幕 */
let timer = null;
let stream = null;         /* 当前播放序列（含分支序列） */
let pendingChoice = null;  /* 正在展示的选择 */
let choiceIdx = -1;        /* 选择对象在原始序列中的位置 */
let musicOn = false;
let toastTimer = null;

function bgFor(S){ return USE_DEBUG_BG ? DEBUG_BG : S.img; }
function getLines(){ return stream; }

function setStream(){
  stream = SCENES[scene].lines.filter(function(l){ return !l.if || state.flags[l.if]; });
}

/* ---- 打字机 ---- */
function typeLine(l){
  const full = l.text;
  let pos = 0;
  typing = true;
  setSpeaker(l.who);
  lineEl.classList.toggle('action', full.charAt(0) === '（');
  hintEl.style.visibility = 'hidden';
  lineEl.textContent = '';
  clearInterval(timer);
  timer = setInterval(function(){
    pos++;
    lineEl.textContent = full.slice(0, pos);
    if(pos < full.length){
      const caret = document.createElement('span');
      caret.className = 'caret';
      lineEl.appendChild(caret);
    }
    if(pos >= full.length){
      clearInterval(timer);
      typing = false;
      if(idx === getLines().length - 1){ finished = true; setEndHint(); }
      hintEl.style.visibility = 'visible';
    }
  }, 55);
}

function finishLine(){
  const ls = getLines();
  if(idx < 0 || idx >= ls.length) return;
  clearInterval(timer);
  lineEl.textContent = ls[idx].text;
  typing = false;
  if(idx === ls.length - 1){ finished = true; setEndHint(); }
  hintEl.style.visibility = 'visible';
}

function setSpeaker(who){
  speakerEl.textContent = WHO_NAME[who] || WHO_NAME.narration;
  speakerEl.className = 'pro-speaker' + (who === 'narration' ? '' : ' ' + who);
}

function setEndHint(){
  if(scene === SCENES.length - 1){
    hintEl.textContent = '序章 · 完 —— 下一篇：返城创业 · 承包谈判';
    hintEl.classList.add('done');
  } else {
    hintEl.textContent = '▼ 进入下一幕';
    hintEl.classList.remove('done');
  }
}

/* ---- 数值面板 ---- */
function renderHud(){
  let html = '';
  STAT_ORDER.forEach(function(k){
    html += '<div class="pro-hud-row"><span>' + STAT_NAME[k] + '</span><b>' + state.stats[k] + '</b></div>';
  });
  hudStats.innerHTML = html;
}

function applyEffects(effects){
  if(!effects) return;
  Object.keys(effects).forEach(function(k){
    if(k in state.stats) state.stats[k] += effects[k];
  });
  renderHud();
}

function toastEffects(effects){
  if(!effects) return;
  const parts = [];
  Object.keys(effects).forEach(function(k){
    if(!(k in STAT_NAME)) return;
    const v = effects[k];
    parts.push((v > 0 ? '+' : '') + v + ' ' + STAT_NAME[k]);
  });
  if(parts.length) toast(parts.join(' · '));
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}

/* ---- 分支选择音效（每个选项可配不同音效；当前路径为占位符 #，替换成真实音效文件路径即可） ---- */
function playSfx(path){
  if(!path) return;
  try{
    const a = new Audio(path);
    a.volume = 0.6;
    const p = a.play();
    if(p && p.catch){
      p.catch(function(){ if(path !== '#') toast('音效文件缺失：' + path); });
    }
  }catch(e){
    if(path !== '#') toast('音效文件缺失：' + path);
  }
}

/* ---- 分支选择 ---- */
function showChoices(c){
  pendingChoice = c;
  choiceIdx = idx;
  choicesTitle.textContent = c.prompt;
  choicesList.innerHTML = '';
  c.options.forEach(function(opt){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-choice';
    btn.textContent = opt.label;
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      playSfx(opt.sound);
      pickChoice(opt.key);
    });
    choicesList.appendChild(btn);
  });
  choicesBox.hidden = false;
  bodyEl.classList.add('has-stats');
  renderHud();
}

function pickChoice(key){
  const c = pendingChoice;
  if(!c) return;
  const opt = c.options.find(function(o){ return o.key === key; });
  pendingChoice = null;
  choicesBox.hidden = true;

  applyEffects(opt.effects);
  toastEffects(opt.effects);
  Object.assign(state.flags, opt.flags || {});

  const follow = [];
  if(opt.text) follow.push({ who: 'you', text: opt.text });
  if(c.after && c.after[key]){
    follow.push.apply(follow, c.after[key]);
  } else {
    follow.push.apply(follow, getLines().slice(choiceIdx + 1));
  }

  stream = follow;
  idx = -1; typing = false; finished = false;
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}

/* ---- 推进 ---- */
function advance(){
  if(switching) return;
  if(pendingChoice) return;
  if(finished){
    if(scene < SCENES.length - 1) switchScene();
    return;
  }
  if(typing){ finishLine(); return; }
  if(idx < getLines().length - 1){
    idx++;
    const l = getLines()[idx];
    if(l.choice){ showChoices(l.choice); return; }
    typeLine(l);
  }
}

function preloadNext(){
  if(scene + 1 < SCENES.length){
    const im = new Image();
    im.src = bgFor(SCENES[scene + 1]);
  }
}

/* ---- 切换至下一幕 ---- */
function switchScene(){
  if(switching) return;
  if(scene >= SCENES.length - 1) return;
  switching = true;
  scene++;
  const S = SCENES[scene];
  stackEl.style.opacity = '0';
  setTimeout(function(){
    bgEl.src = bgFor(S);
    bgEl.alt = S.alt;
    sceneTagEl.textContent = S.tag;
    document.title = S.chapter;
    bodyEl.dataset.scene = String(scene + 1);
    setStream();
    idx = -1; typing = false; finished = false;
    hintEl.classList.remove('done');
    hintEl.textContent = '▼ 点击继续';
    hintEl.style.visibility = 'visible';
    stackEl.style.opacity = '1';
    sceneTagEl.classList.remove('anim');
    void sceneTagEl.offsetWidth;
    sceneTagEl.classList.add('anim');
    preloadNext();
    setTimeout(function(){ switching = false; advance(); }, 1100);
  }, 600);
}

/* ---- 音乐开关 ---- */
function toggleMusic(){
  if(musicOn){
    bgm.pause();
    musicOn = false;
    musicBtn.classList.remove('is-on');
    return;
  }
  const p = bgm.play();
  if(p && p.catch){
    p.catch(function(){
      musicOn = false;
      musicBtn.classList.remove('is-on');
      toast('未找到背景音乐：请把音乐文件放到 ./assets/bgm/ 占位路径');
    });
  }
  musicOn = true;
  musicBtn.classList.add('is-on');
}
bgm.addEventListener('error', function(){
  musicOn = false;
  musicBtn.classList.remove('is-on');
});
musicBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleMusic();
});

/* ---- 启动 ---- */
setStream();
bgEl.src = bgFor(SCENES[0]);
renderHud();
setTimeout(advance, 1600);

document.addEventListener('click', function(){ advance(); });
document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  /* 继续：空格 / 回车 / 下 / 右 / Z */
  if(k === ' ' || k === 'enter' || k === 'arrowdown' || k === 'arrowright' || k === 'z'){
    e.preventDefault();
    advance();
  }
  /* 打字时按 X：立即显示完整一行 */
  if(k === 'x'){
    e.preventDefault();
    if(typing) finishLine();
  }
});
</script>
</body>
</html>
