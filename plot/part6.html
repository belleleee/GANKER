<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宗庆后 · 第⑥部分 · 达能之争 · 2007</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./level_one_pixel.css">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&display=swap">
</head>
<body class="zqh-prologue" data-scene="1">

  <!-- ===== 背景层 ===== -->
  <div class="pro-bg" id="bgStack">
    <img class="pro-bg-img" id="bg" src="./assets/bg/scene6-1.png" alt="办公室·收购函" />
    <div class="pro-vignette"></div>
    <div class="pro-bottom-fade"></div>
    <div class="pro-grain"></div>
  </div>

  <!-- ===== 白雾转场层 ===== -->
  <div class="pro-fog" id="fog"></div>

  <!-- ===== 场景角标 ===== -->
  <div class="pro-scene-tag anim" id="sceneTag">杭州 · 二〇〇七年春</div>

  <!-- ===== 音乐开关 ===== -->
  <button class="pro-music" id="musicBtn" type="button" aria-label="背景音乐开关" title="背景音乐">
    <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l11-2v13"/><circle cx="9" cy="18" r="3"/><circle cx="20" cy="16" r="3"/>
    </svg>
    <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l11-2v13"/><circle cx="9" cy="18" r="3"/><circle cx="20" cy="16" r="3"/><line x1="3" y1="4" x2="21" y2="20"/>
    </svg>
  </button>

  <!-- ===== 数值面板 ===== -->
  <div class="pro-hud" id="hud">
    <div class="pro-hud-title">家　底</div>
    <div id="hudStats"></div>
  </div>

  <!-- ===== 对话框 ===== -->
  <div class="pro-dialog">
    <div class="pro-dialog-bar"></div>
    <div class="pro-dialog-main">
      <div class="pro-speaker" id="speaker">旁　白</div>
      <p class="pro-line" id="line"></p>
    </div>
    <div class="pro-hint" id="hint">▼ 点击继续</div>
  </div>

  <!-- ===== 分支选择 ===== -->
  <div class="pro-choices" id="choicesBox" hidden>
    <div class="pro-choices-title" id="choicesTitle"></div>
    <div class="pro-choices-list" id="choicesList"></div>
  </div>

  <!-- ===== 线索解谜 · 逐字读合同 ===== -->
  <div class="pro-contract" id="contractBox" hidden>
    <div class="pro-contract-panel">
      <span class="pro-contract-kicker">线索解谜 · 逐字读合同</span>
      <h2>找出藏在合同里的陷阱</h2>
      <p class="pro-contract-desc" id="contractDesc">沈律师说：这一页五条里，藏着两条真陷阱。把你认为不对劲的条款勾出来——宁可多勾一条，也别漏掉一条。多勾了，最多费点口舌；漏掉一条……那就是没看见。</p>
      <div class="pro-contract-list" id="contractList"></div>
      <div class="pro-contract-result" id="contractResult" hidden></div>
      <button class="pro-contract-submit" id="contractSubmit" type="button">提交判定</button>
      <button class="pro-contract-next" id="contractNext" type="button" hidden>继　续</button>
    </div>
  </div>

  <!-- ===== 结算面板 ===== -->
  <div class="pro-settle" id="settleBox" hidden>
    <div class="pro-settle-panel">
      <span class="pro-settle-kicker" id="settleKicker"></span>
      <h2 class="pro-settle-title" id="settleTitle"></h2>
      <p class="pro-settle-desc" id="settleDesc"></p>
      <ul class="pro-settle-list" id="settleList"></ul>
      <button class="pro-settle-next" id="settleNext" type="button">继　续</button>
    </div>
  </div>

  <div class="pro-toast" id="toast"></div>

  <!-- 背景音乐 -->
  <audio id="bgm" src="./assets/bgm/test1.flac" loop preload="none"></audio>

<script>
/* =====================================================================
 * 配置区
 * ===================================================================== */
const USE_DEBUG_BG = false;
const DEBUG_BG = './assets/debug-bg.png';
/* 分支判定结果通过 flags 静默写入 localStorage：
   contract_perfect / contract_partial → 正常进入 part7
   contract_miss / control_lost → part7 读取后决定是否进入 sideb（替别人做的嫁衣） */
const SAVE_KEY = 'zqh_level1_save';

/* =====================================================================
 * 行类型：{who,text} 对白/旁白；{if:'标志',who,text} 条件行；
 * {contract:true} 线索解谜（逐字读合同，三档判定）；
 * {settle:{...}} 结算面板；{toast:'文本'} 只弹提示不占行。
 * ===================================================================== */
const SCENES = [
  {
    chapter: '第一幕 · 办公室',
    tag: '杭州 · 二〇〇七年春',
    img: './assets/bg/scene6-1.png',
    alt: '办公室·收购函',
    lines: [
      { who: 'laozong', text: '（站在你旁边）最难的一页来了。这一回没有对手，只有一张纸。' },
      { who: 'narration', text: '从 1998 年那场可乐仗打赢，到 2007 年，又是九年。非常可乐在下沉市场扎下了根，娃哈哈也长成了全国数得着的饮料龙头。当年跟我合资的那家外方，这十年里一直安安稳稳地分着红。' },
      { who: 'narration', text: '直到这一天，一封措辞客气的来函摆上了我的桌——他们愿意出 40 亿，"收购"我的一部分资产和股权。' },
      { who: 'you', text: '（把信翻来覆去看了两遍，抬头）40 亿……买的是什么？' },
      { who: 'fan', text: '（戴着老花镜，把意向书末尾那行小字念出来）商标、渠道，还有……"同类业务相关资产"。' },
      { who: 'narration', text: '我一下子明白了。他们分了十年红，如今要的不是分红——是连树带根，把我亲手栽大的这一片整个挖走。而他们手里握着的，还是十年前我们一起签下的那份合同。' },
      { who: 'you', text: '（沉默了一会儿，把信放回桌上，声音很平）……把当年那份合同，找出来。' }
    ]
  },
  {
    chapter: '第二幕 · 会议室',
    tag: '会议室 · 当夜',
    img: './assets/bg/scene6-2.png',
    alt: '会议室·夜读合同',
    lines: [
      { who: 'narration', text: '合同厚厚一摞，密密麻麻全是小字。我前半生吃过"看不懂字"的亏——当年在乡下，成分不好，连读书的门都够不着；如今，我逼着自己一个字一个字地，把这十年的字全抠一遍。' },
      { who: 'shenlawyer', text: '（笔尖点在纸上）这五条，是整份合同的骨。你别把它们当五句话读——当成五扇门。' },
      { who: 'you', text: '哪几扇门有鬼？' },
      { who: 'shenlawyer', text: '（摇头）我不替你看。我只教你认字。第一种，凡是把你手里的东西——商标、渠道、业务——的处置权，轻轻巧巧"交到别人桌上"的，你要停下来；第二种，凡是带着"优先""同类""相关"这种能无限放大的词的，你要停下来。' },
      { who: 'shenlawyer', text: '（顿了顿，把笔放下）还有一句实在话：合同里最要命的那两句，往往长得最像人话。' },
      { who: 'shenlawyer', text: '这一页五条里，藏着两条真陷阱——不多，也不少。明天上了桌，你把看着不对的挑出来就行。' },
      { who: 'you', text: '（点头）要是拿不准呢？' },
      { who: 'shenlawyer', text: '（笑了一下）宁可多勾一条，也别漏掉一条。多勾了，最多是谈的时候费点口舌；漏掉一条……那就是没看见。没看见的字，往后是要用好多年去还的。' },
      { who: 'you', text: '（把合同合上，手指在封皮上按了按）好。明天，我一条一条念给他听。' }
    ]
  },
  {
    chapter: '第三幕 · 谈判室',
    tag: '谈判室 · 次日',
    img: './assets/bg/scene6-3.png',
    alt: '谈判室·中外对坐',
    lines: [
      { who: 'fanrep', text: '（推过一份文件，中文说得不急不缓）宗先生，我们是老朋友了。合同上写着——"如需商标转让，须提交合资公司董事会审议"。这不是抢，这是走流程。' },
      { who: 'you', text: '（没接文件，只把面前那份划了红线的合同，慢慢推回他面前）流程？范先生，你把我们的商标，送到一张你说了算的桌子上，再管这叫"流程"？' },
      { who: 'narration', text: '谈判室外面，不知什么时候聚起了一群人——王师傅带着一帮已经退休的老工人站在廊下，田老板带着几个乡镇经销商蹲在台阶上抽烟。这十年我在厂门口立下的三条规矩、一乡一镇送出来的交情，此刻都来了，不用我叫。' },
      { who: 'tianlaoban', text: '（隔着门喊了一嗓子）宗厂长！那字你认得的，我们都信你！' },
      { who: 'you', text: '（把笔帽拔了，抬头看着范代表）这十年，别的地方我可以糊涂。字，我一个字一个字读。范先生，这份合同我读了一夜——今天，我一条一条念给你听。' },
      { contract: true },
      { if: 'contract_perfect', who: 'narration', text: '两条真陷阱，我一条不落地揪了出来。我指给范代表看：哪一条能把商标的处置权架空，哪一条能把我的非合资业务整个吞掉。他一页一页翻过去，翻到最后，没再说话。' },
      { if: 'contract_perfect', who: 'fanrep', text: '（把合同合上，半晌）宗先生，我建议……我们重新谈。' },
      { if: 'contract_perfect', settle: {
        kicker: '第⑥部分 · 达能之争结算',
        title: '全选对 · 陷阱揪出',
        desc: '两条真陷阱一条不落地揪了出来，保住控制权，声誉大涨。',
        items: ['现金 <b>×1.15</b>', '声誉 <b>+20</b>'],
        effects: { cash_mult: 1.15, reputation: 20 }
      } },
      { if: 'contract_partial', who: 'narration', text: '两条真陷阱我都看出来了，只是谨慎起见，多划了几条本没问题的。谈判桌上，我据理力争，也为此多费了不少周章——但最要紧的两条，我一条也没放过去。' },
      { if: 'contract_partial', settle: {
        kicker: '第⑥部分 · 达能之争结算',
        title: '部分对 · 守住主导',
        desc: '看出了关键问题，虽然多费周章，仍然守住了主导权。',
        items: ['现金 <b>×0.82</b>', '声誉 <b>+8</b>'],
        effects: { cash_mult: 0.82, reputation: 8 }
      } },
      { if: 'contract_miss', who: 'narration', text: '我把合同翻到最后一页，签了字。那两颗雷，我没看见——一颗藏在"董事会审议"的客气里，一颗藏在"优先收购"的顺理成章里。合同合上的那一刻，会议室很安静，谁也没有说话。' },
      { if: 'contract_miss', who: 'shenlawyer', text: '（站在门口，看着你，欲言又止）……宗总，有些字，当时没看懂，往后是要用好多年去还的。' },
      { if: 'contract_miss', settle: {
        kicker: '第⑥部分 · 达能之争结算',
        title: '漏选 · 陷阱未识破',
        desc: '陷阱没有被及时识破，公司元气受损。',
        items: ['现金 <b>×0.5</b>', '声誉 <b>−15</b>', '「控制权」流失'],
        effects: { cash_mult: 0.5, reputation: -15, control_lost: true }
      } }
    ]
  },
  {
    chapter: '第四幕 · 牌子还是我的',
    tag: '厂门口 · 接选出陷阱结局',
    img: './assets/bg/scene6-4.png',
    alt: '厂门口·手持合同',
    if: 'contract_pass',
    lines: [
      { who: 'narration', text: '这一仗，我没有赢得多漂亮。但我守住了最要紧的一样——"娃哈哈"这三个字，还姓宗。' },
      { who: 'narration', text: '我前半生都在补"看不懂门"的亏；如今我学会了自己一字一句地读合同——门，得自己认得开。' },
      { who: 'narration', text: '外患挡回去了，我把目光转回自己那张网。十几年的交情不能只靠情分撑着，得立成规矩，让所有人都能长久地活下去。那又是几年后的事了。' },
      { who: 'you', text: '（站在厂门口，手里捏着那份划满红线的合同，望着车间里灯火通明）……字要看懂，再签。这句话，我讲了一辈子，今天才算真正讲够了。' }
    ]
  }
];

/* =====================================================================
 * 引擎
 * ===================================================================== */
const WHO_NAME = {
  narration: '旁　白', you: '我', laozong: '老　宗',
  fan: '范老师', shenlawyer: '沈律师', fanrep: '范代表',
  tianlaoban: '田老板', wangshifu: '王师傅'
};
const STAT_NAME = {
  resilience: '坚韧', ahai_bond: '与阿海的情谊', negotiation_skill: '谈判', father_bond: '与父亲的羁绊'
};
const STAT_ORDER = ['resilience', 'ahai_bond', 'negotiation_skill', 'father_bond'];

const state = {
  stats: { resilience: 0, ahai_bond: 0, negotiation_skill: 0, father_bond: 0 },
  cash: 0,
  reputation: 0,
  flags: {}
};

const lineEl = document.getElementById('line');
const hintEl = document.getElementById('hint');
const speakerEl = document.getElementById('speaker');
const bgEl = document.getElementById('bg');
const sceneTagEl = document.getElementById('sceneTag');
const stackEl = document.getElementById('bgStack');
const bodyEl = document.body;
const choicesBox = document.getElementById('choicesBox');
const choicesTitle = document.getElementById('choicesTitle');
const choicesList = document.getElementById('choicesList');
const hudStats = document.getElementById('hudStats');
const toastEl = document.getElementById('toast');
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
const contractBox = document.getElementById('contractBox');
const contractList = document.getElementById('contractList');
const contractResult = document.getElementById('contractResult');
const contractSubmit = document.getElementById('contractSubmit');
const contractNext = document.getElementById('contractNext');
const settleBox = document.getElementById('settleBox');
const fogEl = document.getElementById('fog');

let scene = 0;
let idx = -1;
let typing = false;
let finished = false;
let switching = false;
let timer = null;
let stream = null;
let pendingChoice = null;
let choiceIdx = -1;
let pendingContract = null;
let pendingSettle = null;
let musicOn = false;
let toastTimer = null;
let fogOpen = true;

/* ---- 线索解谜状态 ---- */
let contractOpen = false;
let contractSelected = [];

/* ---- 白雾转场 ---- */
function resetFog(){
  fogOpen = true;
  fogEl.classList.remove('dispersed');
}
function disperseFog(){
  if(!fogOpen) return;
  fogOpen = false;
  fogEl.classList.add('dispersed');
}

function bgFor(S){ return USE_DEBUG_BG ? DEBUG_BG : S.img; }
function getLines(){ return stream; }

function setStream(){
  stream = SCENES[scene].lines.filter(function(l){
    if(l.if && !state.flags[l.if]) return false;
    return true;
  });
}

/* ---- 打字机 ---- */
function typeLine(l){
  const full = l.text;
  let pos = 0;
  typing = true;
  setSpeaker(l.who);
  lineEl.classList.toggle('action', full.charAt(0) === '（');
  hintEl.style.visibility = 'hidden';
  lineEl.textContent = '';
  clearInterval(timer);
  timer = setInterval(function(){
    pos++;
    lineEl.textContent = full.slice(0, pos);
    if(pos < full.length){
      const caret = document.createElement('span');
      caret.className = 'caret';
      lineEl.appendChild(caret);
    }
    if(pos >= full.length){
      clearInterval(timer);
      typing = false;
      if(idx === getLines().length - 1){ finished = true; setEndHint(); }
      hintEl.style.visibility = 'visible';
    }
  }, 55);
}

function finishLine(){
  const ls = getLines();
  if(idx < 0 || idx >= ls.length) return;
  clearInterval(timer);
  lineEl.textContent = ls[idx].text;
  typing = false;
  if(idx === getLines().length - 1){ finished = true; setEndHint(); }
  hintEl.style.visibility = 'visible';
}

function setSpeaker(who){
  speakerEl.textContent = WHO_NAME[who] || WHO_NAME.narration;
  speakerEl.className = 'pro-speaker' + (who === 'narration' ? '' : ' ' + who);
}

function setEndHint(){
  if(scene === SCENES.length - 1 || nextSceneIdx() >= SCENES.length){
    if(state.flags.contract_miss){
      hintEl.textContent = '第⑥部分 · 完';
    } else {
      hintEl.textContent = '第⑥部分 · 完';
    }
    hintEl.classList.add('done');
    /* 静默存档：数值与分支标志写入 localStorage，供 part7 读取后自行决定是否进入 sideb */
    saveStats();
  } else {
    hintEl.textContent = '▼ 进入下一幕';
    hintEl.classList.remove('done');
  }
}

/* ---- 数值面板 ---- */
function renderHud(){
  hudStats.innerHTML =
    '<div class="pro-hud-row"><span>现金</span><b>¥' + state.cash + '</b></div>' +
    '<div class="pro-hud-row"><span>声誉</span><b>' + state.reputation + '</b></div>';
}

/* ---- 数值存档 ---- */
function saveStats(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      stats: {
        resilience: state.stats.resilience,
        ahai_bond: state.stats.ahai_bond,
        negotiation_skill: state.stats.negotiation_skill,
        father_bond: state.stats.father_bond,
        cash: state.cash,
        reputation: state.reputation
      },
      flags: state.flags,
      savedAt: new Date().toISOString()
    }));
  }catch(e){}
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
}

/* ---- 音效 ---- */
function playSfx(path){
  if(!path) return;
  try{
    const a = new Audio(path);
    a.volume = 0.6;
    const p = a.play();
    if(p && p.catch){
      p.catch(function(){ if(path !== '#') toast('音效文件缺失：' + path); });
    }
  }catch(e){
    if(path !== '#') toast('音效文件缺失：' + path);
  }
}

/* ---- 分支选择 ---- */
function showChoices(c){
  pendingChoice = c;
  choiceIdx = idx;
  choicesTitle.textContent = c.prompt;
  choicesList.innerHTML = '';
  c.options.forEach(function(opt){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pro-choice';
    btn.textContent = opt.label;
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      playSfx(opt.sound);
      pickChoice(opt.key);
    });
    choicesList.appendChild(btn);
  });
  choicesBox.hidden = false;
  renderHud();
}

function pickChoice(key){
  const c = pendingChoice;
  if(!c) return;
  const opt = c.options.find(function(o){ return o.key === key; });
  pendingChoice = null;
  choicesBox.hidden = true;

  if(opt.effects){
    Object.keys(opt.effects).forEach(function(k){
      if(k in state.stats) state.stats[k] += opt.effects[k];
    });
    saveStats();
  }
  Object.assign(state.flags, opt.flags || {});

  const follow = [];
  if(opt.text) follow.push({ who: 'you', text: opt.text });
  if(c.after && c.after[key]){
    follow.push.apply(follow, c.after[key]);
  } else {
    follow.push.apply(follow, getLines().slice(choiceIdx + 1));
  }

  stream = follow;
  idx = -1; typing = false; finished = false;
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}

/* =====================================================================
 * 线索解谜 · 逐字读合同
 * 5 条条款中藏 2 条陷阱——第二条、第三条。
 * 判定三档：
 * ① 全选对（只勾了第2、3条）→ contract_perfect：现金 ×1.15、声誉 +20
 * ② 部分对（勾了第2、3条，但多勾了正常条款）→ contract_partial：现金 ×0.82、声誉 +8
 * ③ 漏选（漏掉第2或第3条）→ contract_miss：转入坏结局 part7sideb.html
 * ===================================================================== */
const CONTRACT_CLAUSES = [
  { key: 1, text: '双方共同享有合资公司的正常经营收益。', trap: false },
  { key: 2, text: '如需商标转让，须提交合资公司董事会审议。', trap: true },
  { key: 3, text: '外方可优先收购与合资公司同类业务相关资产。', trap: true },
  { key: 4, text: '投资款项将按约定分期到位。', trap: false },
  { key: 5, text: '双方应保持现有品牌市场秩序。', trap: false }
];

function startContract(){
  contractOpen = true;
  contractSelected = [];
  hintEl.style.visibility = 'hidden';
  contractResult.hidden = true;
  contractResult.className = 'pro-contract-result';
  contractNext.hidden = true;
  contractSubmit.hidden = false;
  contractSubmit.disabled = false;
  contractSubmit.textContent = '提交判定';

  contractList.innerHTML = '';
  CONTRACT_CLAUSES.forEach(function(c){
    const item = document.createElement('div');
    item.className = 'pro-contract-item';
    item.dataset.key = c.key;
    item.innerHTML =
      '<span class="clause-num">' + c.key + '</span>' +
      '<span class="clause-text">' + c.text + '</span>' +
      '<span class="clause-check">✓</span>';
    item.addEventListener('click', function(){
      if(contractNext.hidden === false) return; /* 已出结果后不可再改 */
      const k = Number(item.dataset.key);
      const pos = contractSelected.indexOf(k);
      if(pos >= 0){
        contractSelected.splice(pos, 1);
        item.classList.remove('selected');
      } else {
        contractSelected.push(k);
        item.classList.add('selected');
      }
    });
    contractList.appendChild(item);
  });

  contractBox.hidden = false;
}

contractSubmit.addEventListener('click', function(ev){
  ev.stopPropagation();
  submitContract();
});

function submitContract(){
  if(contractSelected.length === 0){
    toast('请至少勾选一条你认为有陷阱的条款');
    return;
  }
  contractSubmit.disabled = true;

  const trapKeys = CONTRACT_CLAUSES.filter(function(c){ return c.trap; }).map(function(c){ return c.key; });
  const selectedTraps = contractSelected.filter(function(k){ return trapKeys.indexOf(k) >= 0; });
  const missedTraps = trapKeys.filter(function(k){ return contractSelected.indexOf(k) < 0; });
  const wrongSelected = contractSelected.filter(function(k){ return trapKeys.indexOf(k) < 0; });

  /* 清除旧 flag */
  delete state.flags.contract_perfect;
  delete state.flags.contract_partial;
  delete state.flags.contract_miss;
  delete state.flags.contract_pass;

  let resultClass, resultText;
  if(missedTraps.length === 0 && wrongSelected.length === 0){
    /* 全选对 */
    state.flags.contract_perfect = true;
    state.flags.contract_pass = true;
    resultClass = 'perfect';
    resultText = '两条真陷阱，你一条不落地揪了出来——第二条把商标的处置权送到了对方说了算的桌上，第三条用"优先""同类""相关"三个词，把你的非合资业务整个圈了进去。范代表一页一页翻过去，翻到最后，没再说话。';
  } else if(missedTraps.length === 0 && wrongSelected.length > 0){
    /* 部分对 */
    state.flags.contract_partial = true;
    state.flags.contract_pass = true;
    resultClass = 'partial';
    resultText = '两条真陷阱你都看出来了，只是谨慎起见，多划了 ' + wrongSelected.length + ' 条本没问题的。谈判桌上，你据理力争，也为此多费了不少周章——但最要紧的两条，你一条也没放过去。';
  } else {
    /* 漏选 */
    state.flags.contract_miss = true;
    resultClass = 'miss';
    resultText = '那两颗雷，你没看见——一颗藏在"董事会审议"的客气里，一颗藏在"优先收购"的顺理成章里。合同合上的那一刻，会议室很安静。沈律师站在门口，欲言又止：有些字，当时没看懂，往后是要用好多年去还的。';
  }

  contractResult.className = 'pro-contract-result ' + resultClass;
  contractResult.textContent = resultText;
  contractResult.hidden = false;
  contractSubmit.hidden = true;
  contractNext.hidden = false;

  /* 锁定已选项的视觉状态 */
  document.querySelectorAll('.pro-contract-item').forEach(function(el){
    el.style.pointerEvents = 'none';
  });
}

contractNext.addEventListener('click', function(ev){
  ev.stopPropagation();
  endContract();
});

function endContract(){
  contractOpen = false;
  contractBox.hidden = true;
  bodyEl.classList.add('has-stats');
  renderHud();
  saveStats();
  setStream();
  idx = -1;
  for(let i = 0; i < stream.length; i++){
    if(stream[i].contract){ idx = i; break; }
  }
  typing = false;
  finished = (idx >= stream.length - 1);
  if(finished) setEndHint();
  hintEl.classList.remove('done');
  hintEl.style.visibility = 'visible';
  advance();
}

/* ---- 结算面板 ---- */
function showSettle(s){
  pendingSettle = s;
  document.getElementById('settleKicker').textContent = s.kicker || '';
  document.getElementById('settleTitle').textContent = s.title || '';
  document.getElementById('settleDesc').textContent = s.desc || '';
  const list = document.getElementById('settleList');
  list.innerHTML = '';
  (s.items || []).forEach(function(it){
    const li = document.createElement('li');
    li.innerHTML = it;
    list.appendChild(li);
  });
  settleBox.hidden = false;
  hintEl.style.visibility = 'hidden';
}

function endSettle(){
  const s = pendingSettle;
  if(!s) return;
  pendingSettle = null;
  settleBox.hidden = true;
  const fx = s.effects || {};
  const parts = [];
  if(fx.cash_mult){
    const old = state.cash;
    state.cash = Math.round(old * fx.cash_mult);
    parts.push('现金 ¥' + old + ' → ¥' + state.cash + '（×' + fx.cash_mult + '）');
  }
  if(fx.reputation){
    state.reputation += fx.reputation;
    parts.push((fx.reputation > 0 ? '+' : '') + fx.reputation + ' 声誉');
  }
  if(fx.control_lost){
    state.flags.control_lost = true;
    parts.push('「控制权」流失');
  }
  if(parts.length){
    renderHud();
    saveStats();
    toast(parts.join(' · '));
  }
  if(idx === getLines().length - 1){
    finished = true;
    setEndHint();
  }
  hintEl.style.visibility = 'visible';
  advance();
}

document.getElementById('settleNext').addEventListener('click', function(ev){
  ev.stopPropagation();
  endSettle();
});

/* ---- 推进 ---- */
function advance(){
  if(fogOpen) return;
  if(switching) return;
  if(pendingChoice) return;
  if(contractOpen) return;
  if(pendingSettle) return;
  if(finished){
    if(nextSceneIdx() < SCENES.length) switchScene();
    return;
  }
  if(typing){ finishLine(); return; }
  if(idx < getLines().length - 1){
    idx++;
    const l = getLines()[idx];
    if(l.choice){ showChoices(l.choice); return; }
    if(l.contract){ startContract(); return; }
    if(l.settle){ showSettle(l.settle); return; }
    if(l.toast){
      toast(l.toast);
      if(idx === getLines().length - 1){
        finished = true;
        setEndHint();
        hintEl.style.visibility = 'visible';
      } else {
        advance();
      }
      return;
    }
    typeLine(l);
  }
}

/* 下一幕索引：跳过尚未满足条件的分支幕 */
function nextSceneIdx(){
  let ns = scene + 1;
  while(ns < SCENES.length && SCENES[ns].if && !state.flags[SCENES[ns].if]) ns++;
  return ns;
}

function preloadNext(){
  const ns = nextSceneIdx();
  if(ns < SCENES.length){
    const im = new Image();
    im.src = bgFor(SCENES[ns]);
  }
}

/* ---- 切换至下一幕 ---- */
function switchScene(){
  if(switching) return;
  const ns = nextSceneIdx();
  if(ns >= SCENES.length) return;
  switching = true;
  scene = ns;
  const S = SCENES[scene];
  stackEl.style.opacity = '0';
  setTimeout(function(){
    bgEl.src = bgFor(S);
    bgEl.alt = S.alt;
    sceneTagEl.textContent = S.tag;
    document.title = S.chapter;
    bodyEl.dataset.scene = String(scene + 1);
    setStream();
    idx = -1; typing = false; finished = false;
    hintEl.classList.remove('done');
    hintEl.textContent = '▼ 点击继续';
    hintEl.style.visibility = 'visible';
    stackEl.style.opacity = '1';
    sceneTagEl.classList.remove('anim');
    void sceneTagEl.offsetWidth;
    sceneTagEl.classList.add('anim');
    preloadNext();
    setTimeout(function(){ switching = false; advance(); }, 1100);
  }, 600);
}

/* ---- 音乐开关 ---- */
function toggleMusic(){
  if(musicOn){
    bgm.pause();
    musicOn = false;
    musicBtn.classList.remove('is-on');
    return;
  }
  const p = bgm.play();
  if(p && p.catch){
    p.catch(function(){
      musicOn = false;
      musicBtn.classList.remove('is-on');
    });
  }
  musicOn = true;
  musicBtn.classList.add('is-on');
}
bgm.addEventListener('error', function(){
  musicOn = false;
  musicBtn.classList.remove('is-on');
});
musicBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleMusic();
});

/* =====================================================================
 * 数值继承（从前序部分继承：心性数值 + 现金 + 声誉 + 分支标志）
 * 优先读取 URL 参数，其次读 localStorage 存档；都没有时从默认值开始。
 * ===================================================================== */
const INHERIT_KEYS = ['resilience', 'ahai_bond', 'negotiation_skill', 'father_bond'];

function loadInherited(){
  const out = {};
  const flags = {};
  let got = false;
  let cash = 0;
  let reputation = 0;
  const qs = new URLSearchParams(location.search);
  INHERIT_KEYS.forEach(function(k){
    const v = qs.get(k);
    if(v !== null && v !== '' && !isNaN(Number(v))){ out[k] = Number(v); got = true; }
  });
  const c = qs.get('cash');
  if(c !== null && c !== '' && !isNaN(Number(c))){ cash = Number(c); got = true; }
  const r = qs.get('reputation');
  if(r !== null && r !== '' && !isNaN(Number(r))){ reputation = Number(r); got = true; }
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.stats){
        INHERIT_KEYS.forEach(function(k){
          if(typeof data.stats[k] === 'number' && !(k in out)){ out[k] = data.stats[k]; got = true; }
        });
        if(typeof data.stats.cash === 'number' && !qs.get('cash')){ cash = data.stats.cash; got = true; }
        if(typeof data.stats.reputation === 'number' && !qs.get('reputation')){ reputation = data.stats.reputation; got = true; }
      }
      if(data && data.flags){ Object.assign(flags, data.flags); }
    }
  }catch(e){}
  /* 若没有继承到现金，给一个默认起始值（非常可乐后九年经营所得） */
  if(!got || cash === 0){ cash = 3200; reputation = 55; }
  return { out: out, flags: flags, got: got, cash: cash, reputation: reputation };
}

/* ---- 启动 ---- */
const inherited = loadInherited();
if(inherited.got){
  Object.keys(inherited.out).forEach(function(k){ state.stats[k] = inherited.out[k]; });
}
state.cash = inherited.cash;
state.reputation = inherited.reputation;
Object.assign(state.flags, inherited.flags);
/* 清除 part6 解谜残留 flag，避免上次游玩或 localStorage 旧数据干扰本次分支 */
delete state.flags.contract_perfect;
delete state.flags.contract_partial;
delete state.flags.contract_miss;
delete state.flags.contract_pass;
bodyEl.classList.add('has-stats');
setStream();
bgEl.src = bgFor(SCENES[0]);
renderHud();
if(inherited.flags.factory_bonus){
  toast('已继承「产能底牌」');
}
setTimeout(advance, 1600);

document.addEventListener('click', function(){
  if(fogOpen){ disperseFog(); return; }
  advance();
});
document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k === ' ' || k === 'enter' || k === 'arrowdown' || k === 'arrowright' || k === 'z'){
    e.preventDefault();
    if(fogOpen){ disperseFog(); return; }
    advance();
  }
  if(k === 'x'){
    e.preventDefault();
    if(typing) finishLine();
  }
});
</script>
