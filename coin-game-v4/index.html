<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>钱滚钱 · 魔法小屋</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hud" class="paper">
  <div class="brand">发家之路</div>
  <div class="money-line">◉ <span id="wallet">40</span></div>
  <div class="tiny">今天也要更富一点。</div>
</div>

<div id="controls" class="paper">
  <div class="panel-title">抛硬币</div>
  <div><kbd>WASD</kbd> 移动史莱姆</div>
  <div><kbd>Shift</kbd> 疾跑</div>
  <div><kbd>Space</kbd> 跳跃</div>
  <div><kbd>Enter</kbd> 抛出硬币</div>
  <div><kbd>E</kbd> 收手</div>
  <div><kbd>Q / R</kbd> 调整下注</div>
  <div><kbd>V</kbd> 切换视角</div>
</div>

<div id="upgrade" class="paper">
  <div class="panel-title">硬币升级</div>
  <button id="buyCoinSlot">增加槽位</button>
  <button id="upgradeCoin">提升倍率</button>
  <button id="upgradeChance">幸运卡片</button>
  <button id="buyHelper">史莱姆助手</button>
  <button id="toggleAuto">自动策略：关闭</button>
</div>

<div id="round" class="paper">
  <div class="pair"><span>本轮下注</span><b id="stake">1</b></div>
  <div class="pair"><span>当前倍率</span><b id="multiplier">×1.00</b></div>
  <div class="pair"><span>预计收益</span><b id="potential">1</b></div>
</div>

<button id="mainAction">开始抛出</button>
<div id="hint"></div>
<div id="result"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-house.js"></script>
<script src="js/03-slime.js"></script>
<script src="js/04-coin.js"></script>
<script src="js/05-game.js"></script>
<script src="js/06-main.js"></script>
</body>
</html>
