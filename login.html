<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      登录 | 发家之路
    </title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="assets/js/save-system.js">
    </script>
    <script defer src="assets/js/main.js">
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        发家之路
        <small>
          FORTUNE ROAD
        </small>
      </a>
      <nav>
        <a href="index.html">
          返回首页
        </a>
        <a href="team.html">
          制作小组
        </a>
        <a class="nav-button" href="register.html">
          注册档案
        </a>
      </nav>
    </header>
    <main class="form-page">
      <form class="form-box" data-login-form>
        <p class="eyebrow">
          PLAYER ARCHIVE
        </p>
        <h1>
          欢迎回来
        </h1>
        <p>
          继续书写你尚未完成的商业故事。
        </p>
        <label for="account">
          账号
        </label>
        <input id="account" type="text" placeholder="输入账号" required>
        <label for="password">
          密码
        </label>
        <input id="password" type="password" placeholder="输入密码" required>
        <button class="button" type="submit">
          登录并继续
        </button>
        <p class="form-message" aria-live="polite">
        </p>
        <p>
          还没有档案？
          <a href="register.html">
            创建新玩家
          </a>
        </p>
      </form>
    </main>
  </body>
</html>
