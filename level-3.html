<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      第三关：屡败屡战 | 发家之路
    </title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="assets/js/level-game.js">
    </script>
  </head>
  <body class="level-game-page">
    <main>
      <section class="map-hero level-game level-three" id="level-game" data-level="3" tabindex="0" aria-label="第三关游戏地图">
        <div class="map-hud player-hud">
          <div class="pixel-avatar">
            你
          </div>
          <div>
            <strong>
              第三关 · 屡败屡战
            </strong>
            <dl>
              <div>
                <dt>
                  资金
                </dt>
                <dd data-stat="funds">
                </dd>
              </div>
              <div>
                <dt>
                  声望
                </dt>
                <dd data-stat="reputation">
                </dd>
              </div>
              <div>
                <dt>
                  时间
                </dt>
                <dd data-stat="day">
                </dd>
              </div>
            </dl>
          </div>
        </div>
        <div class="map-hud goal-hud">
          <p>
            当前目标
          </p>
          <strong data-goal>
          </strong>
          <div class="map-progress">
            <span data-progress>
            </span>
          </div>
          <small data-detail>
          </small>
        </div>
        <p class="map-intro">
          第三关 · 屡败屡战　方向键 / WASD 移动
        </p>
        <button class="map-location home" type="button" data-event="home">
          <b>
            公寓
          </b>
          <span>
            召开团队会议
          </span>
        </button>
        <button class="map-location campus" type="button" data-event="campus">
          <b>
            校园
          </b>
          <span>
            整理失败笔记
          </span>
        </button>
        <button class="map-location store" type="button" data-event="store">
          <b>
            便利店
          </b>
          <span>
            拜访第一位商户
          </span>
        </button>
        <div class="map-player">
          <span class="player-head">
          </span>
          <span class="player-body">
          </span>
        </div>
        <p class="map-prompt" aria-live="polite">
          方向键 / WASD 移动
        </p>
        <div class="map-caption">
          <span>
            LEVEL 03 · 1999
          </span>
          <strong>
            屡败屡战
          </strong>
        </div>
        <section class="game-dialog" aria-modal="true" hidden>
          <div class="paper-note">
            <button class="dialog-close" type="button" aria-label="关闭">
              ×
            </button>
            <p class="note-kicker">
            </p>
            <h2>
            </h2>
            <p class="event-copy">
            </p>
            <div class="dialog-choices">
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
